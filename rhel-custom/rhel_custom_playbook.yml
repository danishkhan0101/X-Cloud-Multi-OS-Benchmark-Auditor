---
- name: TM LSB Full Remediation (RHEL Standardized)
  hosts: all
  become: yes
  gather_facts: no  # <-- CRITICAL: Prevents the instant crash on RHEL 8

  # ==========================================
  # SMART BOOTSTRAP (OS SNIFFER & PYTHON FIX)
  # ==========================================
  pre_tasks:
    - name: OS Sniffer - Check RHEL version safely via raw SSH
      ansible.builtin.raw: cat /etc/redhat-release
      register: os_release
      changed_when: false
      ignore_errors: true

    - name: Bootstrap - Install modern Python ONLY on RHEL 8
      ansible.builtin.raw: dnf install -y python39
      when: os_release.stdout is defined and 'release 8' in os_release.stdout
      changed_when: false

    - name: Brain Switch - Point Ansible to Python 3.9 ONLY on RHEL 8
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3.9
      when: os_release.stdout is defined and 'release 8' in os_release.stdout

    - name: Safety Check - Now gather facts normally
      ansible.builtin.setup:

  tasks:

    # ==========================================
    # PATCHING & SELINUX (LSB14, LSB25, LSB26)
    # ==========================================
    
    - name: LSB14 - Ensure all system packages are up to date
      command: dnf upgrade -y
      changed_when: false

    - name: LSB14 - Write Patch Trace Evidence for OpenSCAP
      copy: 
        dest: /var/log/tm_patch_status.log
        content: "PATCH_STATUS=COMPLIANT\n"

    - name: LSB25 - Ensure SELinux core packages are installed
      command: dnf install -y libselinux policycoreutils
      args:
        creates: /usr/sbin/semanage

    - name: LSB26 - Enforce SELinux in config file
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=enforcing'
      
    - name: LSB26 - Apply SELinux Enforcing immediately in runtime
      command: setenforce 1
      ignore_errors: yes # Ignores error if it's already enforcing

    # ==========================================
    # FIREWALL (LSB27 & LSB29 - iptables)
    # ==========================================

    # 🚨 THE FIX 1: Kill the default firewall so it doesn't fight iptables
    - name: Pre-Safety - Disable firewalld (Prevents kernel lockup)
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: true

    - name: LSB27 - Install iptables-services
      command: dnf install -y iptables-services
      args:
        creates: /usr/lib/systemd/system/iptables.service

    # --- ADD THESE TWO NEW TASKS HERE ---
    - name: Safety Check 1.1 - Allow Localhost (Loopback) INPUT (CRITICAL)
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Safety Check 1.2 - Allow Localhost (Loopback) OUTPUT (CRITICAL)
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: lo
        jump: ACCEPT

    - name: Safety Check 1.3 - Allow all ESTABLISHED and RELATED traffic
      ansible.builtin.iptables:
        chain: "{{ item }}"
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
      loop: 
        - INPUT
        - OUTPUT
    # ------------------------------------

    # 🚨 THE FIX 1: Allow SSH packets IN statelessly
    - name: Safety Check 2.1 - Allow ALL incoming SSH connections (INPUT)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 22
        jump: ACCEPT

    # 🚨 THE FIX 2: Allow SSH reply packets OUT statelessly
    - name: Safety Check 2.2 - Allow ALL outgoing SSH responses (OUTPUT)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        source_port: 22
        jump: ACCEPT

    # 🚨 THE FIX 3: Prevent Azure Agent from dying under OUTPUT DROP
    - name: Safety Check 3 - Allow Azure WireServer/Metadata traffic (CRITICAL)
      ansible.builtin.iptables:
        chain: OUTPUT
        destination: 168.63.129.16
        jump: ACCEPT

    - name: LSB29 - Set iptables Default Policies to DROP (INPUT/FORWARD/OUTPUT)
      ansible.builtin.iptables:
        chain: "{{ item }}"
        policy: DROP
      loop: 
        - INPUT
        - FORWARD
        - OUTPUT # Kept here as required by your baseline!

    - name: LSB29 - Save iptables rules to /etc/sysconfig/iptables
      shell: iptables-save > /etc/sysconfig/iptables

    # 🚨 THE FIX 2: Fire & Forget the start command, don't wait for a reply!
    - name: LSB27 - Enable and Start iptables service (Async)
      systemd:
        name: iptables
        state: restarted
        enabled: yes
      async: 45
      poll: 0

    # 🚨 THE FIX 3: Gracefully reconnect to the new SSH session
    - name: Safety Check - Wait for SSH to stabilize after firewall reload
      wait_for_connection:
        delay: 5
        timeout: 60

    # ==========================================
    # SYSTEM CONFIGURATIONS (LSB15, 19, 20, 28)
    # ==========================================

    - name: LSB15 - Enforce Timezone (Modern Systemd)
      timezone: 
        name: Asia/Kuala_Lumpur

    - name: LSB15 - Enforce Timezone (OVAL Scanner Compliance)
      copy:
        dest: /etc/timezone
        content: "Asia/Kuala_Lumpur\n"
        mode: '0644'

    - name: LSB19 & LSB28 - Harden SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.r }}"
        line: "{{ item.l }}"
      loop:
        - { r: '^#?Banner', l: 'Banner /etc/sshbanner.txt' }
        - { r: '^#?PermitRootLogin', l: 'PermitRootLogin no' }
      notify: Restart SSH

    - name: LSB19 - Create Banner Text
      copy:
        dest: /etc/sshbanner.txt
        content: "TM AUTHORIZED ACCESS ONLY. ALL ACTIVITIES ARE MONITORED.\n"

    - name: LSB20 - Disable Uncommon Filesystems
      copy:
        dest: /etc/modprobe.d/tm_hardened.conf
        content: |
          install cramfs /bin/true
          install freevxfs /bin/true
          install jffs2 /bin/true
          install hfs /bin/true
          install hfsplus /bin/true
          install squashfs /bin/true
          install udf /bin/true

    # ==========================================
    # AUDITING & LOGGING (LSB39, LSB41)
    # ==========================================

    - name: LSB39 - Install Auditing Library (audit)
      command: dnf install -y audit
      args:
        creates: /sbin/auditd

    - name: LSB41 - Configure Rsyslog Forwarding to NGSIEM
      lineinfile:
        path: /etc/rsyslog.conf
        line: "*.* @@10.0.0.50:514"
        state: present
      notify: Restart Rsyslog

    # ==========================================
    # SERVICE PURGE (LSB30 - LSB38)
    # ==========================================

    - name: LSB30 to LSB38 - Purge All Forbidden Packages
      command: dnf remove -y squid dovecot vsftpd bind dhcp-server telnet-server rsh openldap-clients net-snmp
      ignore_errors: yes

  handlers:
    - name: Restart SSH
      service: 
        name: sshd 
        state: restarted
        
    - name: Restart Rsyslog
      service:
        name: rsyslog
        state: restarted
