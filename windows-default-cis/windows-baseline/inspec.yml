---
# =============================================================================
# CIS Microsoft Windows Server 2022 Benchmark v5.0.0
# InSpec / CINC Auditor profile — single-file layout
#
# Controls file:  controls/cis_ws2022_v5_0_0_benchmark.rb  (433 controls)
# Remediation:    Invoke-CISRemediation-Combined.ps1        (self-contained)
#
# Run (scan):
#   cinc-auditor exec window-default-cis/window-baseline \
#     -t winrm://HOST --user USER --password PASS \
#     --input server_role=member_server \
#     --input profile_level=1 \
#     --reporter json:report.json
#
# Run (remediate):
#   .\Invoke-CISRemediation-Combined.ps1 -ServerRole member_server
#   .\Invoke-CISRemediation-Combined.ps1 -ServerRole member_server -WhatIf
#   .\Invoke-CISRemediation-Combined.ps1 -ServerRole domain_controller -Sections 17,18
# =============================================================================

name: cis-ws2022-v5
title: CIS Microsoft Windows Server 2022 Benchmark v5.0.0
maintainer: Your Organization
copyright: CIS
license: Apache-2.0
summary: >
  Single-file CIS WS2022 v5.0.0 CINC/InSpec profile.
  433 controls (352 L1 + 75 L2) — Sections 1, 2, 5, 9, 17, 18, 19.
  Companion to Invoke-CISRemediation-Combined.ps1 (self-contained, no helper).
version: 5.0.0

supports:
  - os-family: windows

inputs:
  # ── server_role ──────────────────────────────────────────────────────────
  # Controls DC-only vs member-server-only rules inside the benchmark.
  # Override on the CLI: --input server_role=domain_controller
  - name: server_role
    description: 'Role of the target server: member_server or domain_controller'
    type: string
    value: 'member_server'

  # ── profile_level ────────────────────────────────────────────────────────
  # Metadata consumed by Heimdall / SAF CLI to filter report views.
  # 1 → show L1 controls only; 2 → show L1 + L2 controls.
  # All 433 controls always execute regardless of this value.
  - name: profile_level
    description: 'CIS level for report metadata: 1 (L1 view) or 2 (L1+L2 view)'
    type: numeric
    value: 1
