---
# =============================================================================
# CIS Windows Server 2022 Benchmark v5.0.0 — Ansible Remediation Playbook
# =============================================================================
# Called by: remediate_windows_host() in audit_main.sh
# Invocation:
#   ansible-playbook -i inventory.ini window-default-cis/cis_remediate_2022.yml \
#     --limit <ip> --tags level1-memberserver
#
# Level 1 only:  --tags level1-memberserver
# Level 1 + 2:   --tags level1-memberserver,level2-memberserver
#
# Role source:  ansible-galaxy role install ansible-lockdown.windows_2022_cis
#               https://github.com/ansible-lockdown/Windows-2022-CIS
# =============================================================================
- name: CIS Microsoft Windows Server 2022 — Baseline Remediation
  hosts: windows_nodes
  gather_facts: true

  vars:
    # -----------------------------------------------------------------------
    # ansible-lockdown role variables
    # -----------------------------------------------------------------------
    # Set to true only if this host is a domain controller.
    win22cis_is_domain_controller: false

    # Rule-level toggles — set false to skip individual noisy rules.
    # Uncomment and adjust as needed for your environment.
    # win22cis_rule_2_3_1_1: true
    # win22cis_rule_18_9_x: true

    # Screensaver / timeout — adjust to org policy.
    win22cis_lock_timeout: 900

    # -----------------------------------------------------------------------
    # Passed in from audit_main.sh via --extra-vars or inventory group_vars
    # -----------------------------------------------------------------------
    cis_remediation_level: "{{ cis_level_override | default('1') }}"

  pre_tasks:
    - name: "[Pre] Confirm target is Windows Server 2022"
      ansible.windows.win_shell: |
        (Get-CimInstance Win32_OperatingSystem).Caption
      register: os_caption
      changed_when: false

    - name: "[Pre] Print detected OS"
      ansible.builtin.debug:
        msg: "Target OS: {{ os_caption.stdout | trim }}"

    - name: "[Pre] Fail if not Windows Server 2022"
      ansible.builtin.fail:
        msg: >-
          This playbook is for Windows Server 2022 only.
          Detected: {{ os_caption.stdout | trim }}
      when: "'2022' not in os_caption.stdout"

  roles:
    - role: ansible-lockdown.windows_2022_cis

  post_tasks:
    - name: "[Post] Log remediation completion"
      ansible.builtin.debug:
        msg: >-
          CIS WS2022 remediation complete on {{ inventory_hostname }}.
          Tags applied: {{ ansible_run_tags | default('all') }}.
          A reboot is recommended to fully apply all policy changes.
