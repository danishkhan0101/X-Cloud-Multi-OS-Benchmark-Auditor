plugin: azure.azcollection.azure_rm
include_vm_resource_groups:
  - Packer_RG

# This tells Ansible to create groups based on your Azure Tags!
keyed_groups:
  - prefix: tag
    key: tags

# This tells Ansible whether to use Public or Private IPs to connect
hostvar_expressions:
  ansible_host: public_ipv4_addresses[0]
