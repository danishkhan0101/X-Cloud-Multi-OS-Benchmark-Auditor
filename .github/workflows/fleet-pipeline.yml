name: 🛡️ Fleet Commander Pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compliance Profile'
        required: true
        default: 'tm'
        type: choice
        options:
          - tm
          - cis
      mode:
        description: 'Execution Mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - full
      environment_tag:
        description: 'Target Environment Tag (e.g., Prod, Dev, Staging, or type "all")'
        required: true
        default: 'all'

  schedule:
    - cron: '0 18 * * 5'

  repository_dispatch:
    types: [new_vm_provisioned]

# 🚨 NEW: Required permissions to allow the pipeline to publish a Release
permissions:
  contents: write

jobs:
  run-audit:
    runs-on: ubuntu-latest

    # Add this global block so ALL steps can see these variables
    env:
      TARGET_ENV: ${{ github.event.client_payload.target_env || github.event.inputs.environment_tag || 'Prod' }}
      PROFILE: ${{ github.event.inputs.profile || 'tm' }}
      MODE: ${{ github.event.inputs.mode || 'scan' }}

    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🔑 Setup SSH Key for Ubuntu Targets
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}
          
      # --- ADD THIS NEW BLOCK ---
      - name: 🔓 Extract Public Key for Auto-Healing
        run: |
          mkdir -p ~/.ssh
          ssh-add -L > ~/.ssh/id_rsa.pub

      - name: 🛠️ Install Ansible & InSpec (Cinc Auditor)
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible openscap-scanner openscap-utils
          
          # THE FIX: Bypass the Corporate Paywall using Cinc Auditor
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          
          # Secretly alias Cinc to InSpec so your bash script works perfectly
          sudo ln -sf /usr/bin/cinc-auditor /usr/bin/inspec
          
          # Global Fix for OpenSCAP "Host key verification failed"
          sudo sh -c 'printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" >> /etc/ssh/ssh_config'
          
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: 🚀 Execute Fleet Commander
        env:
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          AZURE_KV_NAME: ${{ vars.AZURE_KV_NAME }}
          AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
          LINUX_ADMIN_USER: ${{ vars.LINUX_ADMIN_USER }}
          WINDOWS_ADMIN_USER: ${{ vars.WINDOWS_ADMIN_USER }}
          EXCLUDE_HOST_NAME: ${{ vars.EXCLUDE_HOST_NAME }}
          
        run: |
          echo "🎯 Targeting Environment: $TARGET_ENV"
          echo "📋 Running Profile: $PROFILE in Mode: $MODE"
          
          chmod +x tm_multi_os_benchmark.sh
          ./tm_multi_os_benchmark.sh --headless --profile "$PROFILE" --mode "$MODE" --targets "$TARGET_ENV"

      # --- 🚨 AUTOMATED RELEASE PUBLISHING (NO ZIPS) ---

      - name: 🏷️ Generate Version Tag
        if: always()
        id: versioning
        run: |
          # Create a dynamic timestamp (e.g., 2026-04-21-0945)
          echo "TIMESTAMP=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      # --- THE NEW GATEKEEPER STEP ---
      - name: 🔎 Verify Report Generation
        id: check_reports
        run: |
          if ls *.html *.json 1> /dev/null 2>&1; then
            echo "✅ Reports found on disk. Proceeding to publish."
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No reports found! The scan must have failed or skipped all VMs."
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      # --- UPDATED RELEASE STEP (Now with an 'if' condition) ---
      - name: 📢 Publish to GitHub Releases
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audit-${{ env.DATE_TAG }}
          name: 🛡️ Fleet Audit Report (${{ env.DATE_TAG }})
          body: |
            ## 📊 DevSecOps Audit Execution
            **Target Environment:** `${{ env.TARGET_ENV }}`
            **Compliance Profile:** `${{ env.PROFILE }}`
            **Execution Mode:** `${{ env.MODE }}`
          files: |
            **/*.html
            **/*.json
