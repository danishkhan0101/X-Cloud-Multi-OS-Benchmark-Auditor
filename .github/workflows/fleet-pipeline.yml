name: 🛡️ Fleet Commander Pipeline

# 1. THE USER INTERFACE (Dropdown Menus)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compliance Profile'
        required: true
        default: 'both'
        type: choice
        options:
          - tm
          - cis
          - both
      mode:
        description: 'Execution Mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - rescan
          - full
      targets:
        description: 'Targets (e.g., 1,3 or type "all")'
        required: true
        default: 'all'

# 2. THE CLOUD RUNNER
jobs:
  run-audit:
    runs-on: ubuntu-latest

    # 3. THE STEPS TO EXECUTE
    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔑 Setup SSH Key for Ubuntu Targets
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}

      - name: 🛠️ Install Ansible & OpenSCAP
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible libopenscap8
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: 🚀 Execute Fleet Commander
        run: |
          chmod +x tm_fleet_commander.sh
          ./tm_fleet_commander.sh --headless --profile ${{ github.event.inputs.profile }} --mode ${{ github.event.inputs.mode }} --targets "${{ github.event.inputs.targets }}"
