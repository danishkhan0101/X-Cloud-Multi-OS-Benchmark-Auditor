name: 🛡️ Fleet Commander Pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compliance Profile'
        required: true
        default: 'tm'
        type: choice
        options:
          - tm
          - cis
      cis_level:
        description: 'CIS Level (ONLY applies if profile is "cis")'
        required: true
        type: choice
        default: 'Level 1'
        options:
          - 'Level 1'
          - 'Level 2'
      mode:
        description: 'Execution Mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - full
      environment_tag:
        description: '🎯 Target Environment (Blast Radius)'
        required: true
        default: 'all'
        type: choice
        options:
          - Dev
          - Staging
          - Prod
          - all
      ticket_id:
        description: '🎫 Change Request / Ticket ID (For Audit Logs)'
        required: false
        type: string
      debug_mode:
        description: '🐞 Enable Debug/Verbose Logging'
        required: false
        default: false
        type: boolean
      cleanup_mode:
        description: '🧹 Post-Audit Cleanup (Uninstall tools from targets)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 18 * * 5'

  repository_dispatch:
    types: [new_vm_provisioned]

# 🚨 Required permissions to allow the pipeline to publish a Release
permissions:
  contents: write

jobs:
  run-audit:
    runs-on: ubuntu-latest

    # Global block so ALL steps can see these variables
    env:
      TARGET_ENV: ${{ github.event.client_payload.target_env || github.event.inputs.environment_tag || 'Prod' }}
      PROFILE: ${{ github.event.inputs.profile || 'tm' }}
      MODE: ${{ github.event.inputs.mode || 'scan' }}
      CIS_LEVEL: ${{ github.event.inputs.cis_level || 'Level 1' }}

    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🔑 Setup SSH Key for Ubuntu Targets
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}
          
      - name: 🔓 Extract Public Key for Auto-Healing
        run: |
          mkdir -p ~/.ssh
          ssh-add -L > ~/.ssh/id_rsa.pub

      - name: 🛠️ Install Core Tools & Ansible (Nuclear Option)
        run: |
          sudo apt-get update
          # 1. Install standard Linux tools ONLY (No Ansible or WinRM here)
          sudo apt-get install -y openscap-scanner openscap-utils sshpass
          
          # 2. Force pip to install Ansible and WinRM together in the local user space
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible pywinrm requests
          
          # 3. Add the local pip directory to the runner's PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Bypass the Corporate Paywall using Cinc Auditor
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          sudo ln -sf /usr/bin/cinc-auditor /usr/bin/inspec
          
          # Global Fix for OpenSCAP SSH
          sudo sh -c 'printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" >> /etc/ssh/ssh_config'
          
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: 🚀 Execute Fleet Commander
        env:
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          AZURE_KV_NAME: ${{ vars.AZURE_KV_NAME }}
          AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
          LINUX_ADMIN_USER: ${{ vars.LINUX_ADMIN_USER }}
          WINDOWS_ADMIN_USER: ${{ vars.WINDOWS_ADMIN_USER }}
          EXCLUDE_HOST_NAME: ${{ vars.EXCLUDE_HOST_NAME }}
          TICKET_ID: ${{ github.event.inputs.ticket_id }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          CLEANUP: ${{ github.event.inputs.cleanup_mode }}
          
        run: |
          echo "🎯 Targeting Environment: $TARGET_ENV"
          echo "📋 Running Profile: $PROFILE in Mode: $MODE"
          
          chmod +x tm_multi_os_benchmark.sh
          ./tm_multi_os_benchmark.sh --headless --profile "$PROFILE" --mode "$MODE" --targets "$TARGET_ENV" --ticket "$TICKET_ID" --debug "$DEBUG_MODE" --cleanup "$CLEANUP"
      # --- 🚨 AUTOMATED RELEASE PUBLISHING ---

      - name: 🏷️ Generate Version Tag
        id: versioning
        run: |
          # THE FIX: Standardized the variable name to DATE_TAG
          echo "DATE_TAG=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: 🔎 Verify Report Generation
        id: check_reports
        run: |
          # Safely count any HTML or JSON files in the current directory
          REPORT_COUNT=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.json" \) | wc -l)
          
          if [ "$REPORT_COUNT" -gt 0 ]; then
            echo "✅ Found $REPORT_COUNT report(s) on disk. Proceeding to publish."
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No reports found! The scan must have failed or skipped all VMs."
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Publish to GitHub Releases
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audit-${{ env.DATE_TAG }}
          name: 🛡️ Fleet Audit Report (${{ env.DATE_TAG }})
          body: |
            ## 📊 DevSecOps Audit Execution
            **Target Environment:** `${{ env.TARGET_ENV }}`
            **Compliance Profile:** `${{ env.PROFILE }}`
            **Execution Mode:** `${{ env.MODE }}`
          files: |
            **/*.html
            **/*.json
