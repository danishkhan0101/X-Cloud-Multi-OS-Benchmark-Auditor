name: 🛡️ Fleet Commander Pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compliance Profile'
        required: true
        default: 'both'
        type: choice
        options:
          - tm
          - cis
          - both
      mode:
        description: 'Execution Mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - rescan
          - full
      targets:
        description: 'Targets (Type "all" or comma-separated IPs)'
        required: true
        default: 'all'

  schedule:
    - cron: '0 18 * * 5'

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      # 🚨 THE FIX: Re-authenticating Azure CLI for your Bash Script using the new separate secrets!
      - name: 🔐 Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🔑 Setup SSH Key for Ubuntu Targets
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}

      - name: 🛠️ Install Ansible & InSpec
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible openscap-scanner
          curl -L https://omnitruck.chef.io/install.sh | sudo bash -s -- -p inspec
          
          # THE FIX: Tell Linux exactly where InSpec lives so bash can find it
          sudo ln -s /opt/inspec/bin/inspec /usr/local/bin/inspec || true
          
          export ANSIBLE_HOST_KEY_CHECKING=False
          export CHEF_LICENSE="accept"

      - name: 🚀 Execute Fleet Commander
        env:
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          AZURE_KV_NAME: ${{ vars.AZURE_KV_NAME }}
          AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
          LINUX_ADMIN_USER: ${{ vars.LINUX_ADMIN_USER }}
          WINDOWS_ADMIN_USER: ${{ vars.WINDOWS_ADMIN_USER }}
          EXCLUDE_HOST_NAME: ${{ vars.EXCLUDE_HOST_NAME }}
          
        run: |
          echo "📋 Running Profile: ${{ github.event.inputs.profile }} in Mode: ${{ github.event.inputs.mode }}"
          
          chmod +x tm_multi_os_benchmark.sh
          ./tm_multi_os_benchmark.sh --headless --profile ${{ github.event.inputs.profile }} --mode ${{ github.event.inputs.mode }} --targets "${{ github.event.inputs.targets }}"
        
      # Add this to the VERY BOTTOM of your steps:
      - name: 💾 Save Compliance Reports
        if: always() # This forces it to upload even if the scan finds vulnerabilities!
        uses: actions/upload-artifact@v4
        with:
          name: TM-Compliance-Reports
          path: |
            *.html
            *.json
            **/*.html 
