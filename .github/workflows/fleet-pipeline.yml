name: 🛡️ Fleet Commander Pipeline

# ┌────────────────────────────────────────────────────────────────────────┐
# │  MULTI-CLOUD: azure | huaweicloud                                      │
# │                                                                        │
# │  SECRETS REQUIRED (Huawei Cloud):                                      │
# │    HW_ACCESS_KEY      IAM AK (Console → My Credentials → Access Keys)  │
# │    HW_SECRET_KEY      IAM SK                                           │
# │    AUDIT_PASS         Windows audit-user password (direct fallback)    │
# │                                                                        │
# │  VARIABLES REQUIRED (Huawei Cloud):                                    │
# │    HW_REGION          e.g. my-kualalumpur-1                            │
# │    HW_PROJECT_ID      Console → My Credentials → Projects              │
# │    HW_CSMS_SECRET     CSMS secret name holding the audit password      │
# │    HW_ECS_TAG_KEY     (optional) tag key to filter ECS instances       │
# │    HW_ECS_TAG_VAL     (optional) tag value to match                    │
# │    HW_VPC_ID          VPC ID to scope security-group queries           │
# │                                                                        │
# │  AUTH MODEL (Huawei Cloud):                                            │
# │    Uses official Python SDK (huaweicloudsdkcore + huaweicloudsdkecs).  │
# │    AK/SK signs each request locally — no hcloud (KooCLI) tool needed.  │
# │    KooCLI was removed because it resolves endpoints from its own       │
# │    internal catalogue (public HW regions only) and cannot reach the    │
# │    private endpoint ecs.my-kualalumpur-1.alphaedge.tmone.com.my.       │
# │    SDK + endpoint confirmed working from GH Actions hosted runners.    │
# └────────────────────────────────────────────────────────────────────────┘
#
# SSH (Linux, both clouds): key-only, no password secret.
#   Azure  → runner's public key is pushed via `az vm run-command`
#            (an out-of-band control-plane channel; see cloud_vm_run_shell
#            in multi_os_benchmark.sh) — works even on a brand-new VM.
#   Huawei → has no such channel in this pipeline, so the runner's public
#            key (secrets.UBUNTU_SSH_KEY) must already be authorized for
#            LINUX_ADMIN_USER on the ECS instance — provision it via
#            cloud-init/user-data at instance creation (baked into the
#            golden image), not at pipeline runtime.
#   VM_SSH_PASSWORD is no longer used anywhere in this workflow — remove
#   it from repo secrets if it's still set.
concurrency:
  group: fleet-commander-${{ github.event.inputs.cloud_provider || 'azure' }}-${{ github.event.inputs.environment_tag || 'all' }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: '☁️  STEP 0: Cloud Provider'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - huaweicloud
      profile:
        description: '🛡️ STEP 1: Select Security Profile'
        required: true
        default: 'tm'
        type: choice
        options:
          - tm
          - cis
          - all
      cis_level:
        description: '📊 STEP 2: CIS Strictness'
        required: true
        type: choice
        default: 'Level 1'
        options:
          - 'Level 1'
          - 'Level 2'
      mode:
        description: '🚀 STEP 3: Action Mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - full
      environment_tag:
        description: '🎯 STEP 4: Target Environment'
        required: true
        default: 'all'
        type: choice
        options:
          - Dev
          - Staging
          - Prod
          - all
      execution_strategy:
        description: '🏗️ STEP 5: Runner Architecture'
        required: true
        default: 'os-grouped'
        type: choice
        options:
          - os-grouped
          - per-node
      ticket_id:
        description: '🎫 Change Request / Jira Ticket ID'
        required: false
        type: string
      debug_mode:
        description: '🐞 Enable Verbose Logs'
        required: false
        default: false
        type: boolean
      cleanup_mode:
        description: '🧹 Delete tools from target servers after scan'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 18 * * 5'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — MATRIX FACTORY
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  prepare-queue:
    runs-on: ubuntu-latest
    outputs:
      matrix:    ${{ steps.build-matrix.outputs.matrix }}
      safe_mode: ${{ steps.safety-gate.outputs.safe_mode }}
      os_matrix: ${{ steps.discover-vms.outputs.os_matrix }}
      cloud:     ${{ steps.set-cloud.outputs.cloud }}

    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4

      - name: '☁️  Resolve Cloud Provider'
        id: set-cloud
        run: |
          CLOUD="${{ github.event.inputs.cloud_provider || 'azure' }}"
          echo "cloud=${CLOUD,,}" >> $GITHUB_OUTPUT
          echo "☁️  Cloud provider: ${CLOUD,,}"

      - name: '🛡️ Safety Gate'
        id: safety-gate
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          MODE="${{ github.event.inputs.mode }}"
          if [[ "$PROFILE" == *"all"* ]] && [ "$MODE" != "scan" ]; then
            echo "⚠️ Mass remediation on 'all' is blocked — forcing scan"
            echo "safe_mode=scan" >> $GITHUB_OUTPUT
          else
            echo "safe_mode=$MODE" >> $GITHUB_OUTPUT
          fi

      - name: '🚦 Build Profile Matrix'
        id: build-matrix
        run: |
          PROFILE_RAW="${{ github.event.inputs.profile }}"
          LEVEL="${{ github.event.inputs.cis_level }}"
          if [[ "$PROFILE_RAW" == *"all"* ]]; then
            echo 'matrix=[{"profile":"all","level":"all","name":"Full-Fleet-Audit"}]' >> $GITHUB_OUTPUT
          elif [[ "$PROFILE_RAW" == *"cis"* ]]; then
            FMT=$(echo "$LEVEL" | tr ' ' '-')
            echo "matrix=[{\"profile\":\"cis\",\"level\":\"$LEVEL\",\"name\":\"CIS-$FMT\"}]" >> $GITHUB_OUTPUT
          else
            echo 'matrix=[{"profile":"tm","level":"Standard","name":"TM-Baseline"}]' >> $GITHUB_OUTPUT
          fi

      # ── Azure auth ──────────────────────────────────────────────────────
      - name: '🔐 [Azure] Login'
        if: steps.set-cloud.outputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      # ── Huawei Cloud auth ───────────────────────────────────────────────
      # FIX: hcloud (KooCLI) removed entirely. It resolves endpoints from its
      # own internal catalogue (public HW regions only) and has no awareness of
      # the private endpoint ecs.my-kualalumpur-1.alphaedge.tmone.com.my,
      # causing hcloud ECS ListServersDetails to silently query the wrong region
      # and return an empty list. The Python SDK signs requests locally with
      # AK/SK and is pointed explicitly at the private endpoint.
      # Confirmed working from GH Actions hosted runners.
      - name: '🔐 [HuaweiCloud] Install SDK & Verify Auth'
        if: steps.set-cloud.outputs.cloud == 'huaweicloud'
        env:
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          HW_REGION:              ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
          HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
        run: |
          echo "📦 Installing Huawei Cloud Python SDK..."
          pip install huaweicloudsdkcore huaweicloudsdkecs huaweicloudsdkvpc --quiet

          echo "🔍 Verifying AK/SK against private ECS endpoint..."
          export HW_ECS_ENDPOINT="https://ecs.${HW_REGION}.alphaedge.tmone.com.my"

          python3 - <<'PYEOF'
          import os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkecs.v2 import EcsClient, ListServersDetailsRequest
          from huaweicloudsdkcore.exceptions import exceptions

          ak         = os.environ["HUAWEICLOUD_ACCESS_KEY"]
          sk         = os.environ["HUAWEICLOUD_SECRET_KEY"]
          project_id = os.environ["HW_PROJECT_ID"]
          endpoint   = os.environ["HW_ECS_ENDPOINT"]

          try:
              client = EcsClient.new_builder() \
                  .with_credentials(BasicCredentials(ak, sk, project_id)) \
                  .with_endpoint(endpoint) \
                  .build()
              resp  = client.list_servers_details(ListServersDetailsRequest())
              count = len(resp.servers) if resp.servers else 0
              print(f"✅ [HuaweiCloud] SDK auth OK — {count} ECS instance(s) visible")
              print(f"   endpoint: {endpoint}")
          except exceptions.ClientRequestException as e:
              print(f"❌ SDK auth failed: {e.status_code} {e.error_code} {e.error_msg}",
                    file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"❌ Unexpected error: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      # ── VM Discovery ────────────────────────────────────────────────────
      - name: '📡 Discover Online VMs'
        id: discover-vms
        env:
          CLOUD:                  ${{ steps.set-cloud.outputs.cloud }}
          TARGET_ENV:             ${{ github.event.inputs.environment_tag || 'all' }}
          STRATEGY:               ${{ github.event.inputs.execution_strategy || 'os-grouped' }}
          RG_NAME:                ${{ vars.AZURE_RG_NAME }}
          HW_REGION:              ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
          HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          HW_ECS_TAG_KEY:         ${{ vars.HW_ECS_TAG_KEY || '' }}
          HW_ECS_TAG_VAL:         ${{ github.event.inputs.environment_tag == 'all' && '' || github.event.inputs.environment_tag }}
          HW_EPS_ID:              ${{ vars.HW_EPS_ID }} # <-- Pulls silently from GitHub Variables
        run: |
          HAS_UBUNTU=false; HAS_RHEL=false; HAS_ROCKY=false
          HAS_ALMA=false;   HAS_WINDOWS=false
          MATRIX_JSON="["

          classify_vm() {
            local os="$1" offer="${2,,}" name="$3" ip="$4"
            ip=$(echo "$ip" | tr -d '\r' | xargs)
            [ -z "$ip" ] || [ "$ip" == "None" ] && return
            local name_lower="${name,,}" NODE_OS=""
            if [[ "$os" == *"Linux"* ]] || [[ "$os" == *"Ubuntu"* ]] || [[ "$os" == *"linux"* ]]; then
              if   [[ "$offer" == *"rocky"* ]] || [[ "$name_lower" == *"rocky"* ]]; then
                HAS_ROCKY=true; NODE_OS="Rocky"
              elif [[ "$offer" == *"alma"* ]] || [[ "$name_lower" == *"alma"* ]]; then
                HAS_ALMA=true;  NODE_OS="Alma"
              elif [[ "$offer" == *"rhel"* ]] || [[ "$name_lower" == *"rhel"* ]]; then
                HAS_RHEL=true;  NODE_OS="RHEL"
              else
                HAS_UBUNTU=true; NODE_OS="Ubuntu"
              fi
            elif [[ "$os" == *"Windows"* ]] || [[ "$os" == *"windows"* ]]; then
              HAS_WINDOWS=true; NODE_OS="Windows"
            fi
            if [ "$STRATEGY" == "per-node" ] && [ -n "$NODE_OS" ]; then
              MATRIX_JSON+="{\"os\":\"$NODE_OS\",\"ip\":\"$ip\"},"
            fi
          }

          # ── Azure ──────────────────────────────────────────────────────
          if [ "$CLOUD" == "azure" ]; then
            echo "📡 [Azure] Querying VMs in [$RG_NAME]..."
            if [ "$TARGET_ENV" == "all" ]; then
              VM_DATA=$(az vm list -d -g "$RG_NAME" \
                --query "[?powerState=='VM running'].[storageProfile.osDisk.osType,storageProfile.imageReference.offer,name,publicIps]" \
                -o tsv)
            else
              VM_DATA=$(az vm list -d -g "$RG_NAME" \
                --query "[?tags.Environment=='$TARGET_ENV' && powerState=='VM running'].[storageProfile.osDisk.osType,storageProfile.imageReference.offer,name,publicIps]" \
                -o tsv)
            fi
            while IFS=$'\t' read -r os offer name raw_ip; do
              classify_vm "$os" "$offer" "$name" "$raw_ip"
            done <<< "$VM_DATA"
          fi

          # ── Huawei Cloud ──────────────────────────────────────────────
          if [ "$CLOUD" == "huaweicloud" ]; then
            HW_ECS_ENDPOINT="https://ecs.${HW_REGION}.alphaedge.tmone.com.my"
            echo "📡 [HuaweiCloud] Querying ECS via SDK [${HW_ECS_ENDPOINT}]..."
          
            # 1. Run the Python script and capture its output to a variable
            HW_RAW=$(
              HUAWEICLOUD_ACCESS_KEY="$HUAWEICLOUD_ACCESS_KEY" \
              HUAWEICLOUD_SECRET_KEY="$HUAWEICLOUD_SECRET_KEY" \
              HW_PROJECT_ID="$HW_PROJECT_ID" \
              HW_ECS_ENDPOINT="$HW_ECS_ENDPOINT" \
              HW_ECS_TAG_KEY="$HW_ECS_TAG_KEY" \
              HW_ECS_TAG_VAL="$HW_ECS_TAG_VAL" \
              HW_EPS_ID="$HW_EPS_ID" \
              python3 hw_ecs_discover.py --tsv
            )
          
            # 2. Check the true exit status of the Python script
            if [ $? -ne 0 ]; then
              echo "❌ [HuaweiCloud] ECS discovery failed."
              echo "   Check: HW_ACCESS_KEY, HW_SECRET_KEY, HW_PROJECT_ID, endpoint"
              [ -s /tmp/hw_discover_err.log ] && cat /tmp/hw_discover_err.log
              exit 1
            fi
          
            # 3. Safely feed the captured output into the loop (only if not empty)
            if [ -n "$HW_RAW" ]; then
              while IFS=$'\t' read -r os offer name ip _srv_id; do
                classify_vm "$os" "$offer" "$name" "$ip"
              done <<< "$HW_RAW"
            fi
          fi

          # ── Build grouped matrix ───────────────────────────────────────
          if [ "$STRATEGY" == "os-grouped" ]; then
            [ "$HAS_UBUNTU"  == true ] && MATRIX_JSON+="{\"os\":\"Ubuntu\",  \"ip\":\"all\"},"
            [ "$HAS_RHEL"    == true ] && MATRIX_JSON+="{\"os\":\"RHEL\",    \"ip\":\"all\"},"
            [ "$HAS_ROCKY"   == true ] && MATRIX_JSON+="{\"os\":\"Rocky\",   \"ip\":\"all\"},"
            [ "$HAS_ALMA"    == true ] && MATRIX_JSON+="{\"os\":\"Alma\",    \"ip\":\"all\"},"
            [ "$HAS_WINDOWS" == true ] && MATRIX_JSON+="{\"os\":\"Windows\", \"ip\":\"all\"},"
          fi
          MATRIX_JSON="${MATRIX_JSON%,}]"
          [ "$MATRIX_JSON" == "]" ] && MATRIX_JSON="[]"
          echo "✅ Active Matrix: $MATRIX_JSON"
          echo "os_matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — EXECUTION ENGINE
# ─────────────────────────────────────────────────────────────────────────────
  run-audit:
    needs: prepare-queue
    if: ${{ needs.prepare-queue.outputs.os_matrix != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:    ${{ fromJSON(needs.prepare-queue.outputs.matrix) }}
        os_target: ${{ fromJSON(needs.prepare-queue.outputs.os_matrix) }}

    env:
      # ── Pipeline context ───────────────────────────────────────────────
      CLOUD_PROVIDER: ${{ needs.prepare-queue.outputs.cloud }}
      TARGET_ENV:     ${{ github.event.inputs.environment_tag || 'Prod' }}
      MODE:           ${{ needs.prepare-queue.outputs.safe_mode }}
      PROFILE:        ${{ matrix.target.profile }}
      CIS_LEVEL:      ${{ matrix.target.level }}
      MATRIX_NAME:    ${{ matrix.target.name }}
      TARGET_OS:      ${{ matrix.os_target.os }}
      TARGET_IP:      ${{ matrix.os_target.ip }}
      # ── Azure ──────────────────────────────────────────────────────────
      AZURE_RG_NAME:   ${{ vars.AZURE_RG_NAME }}
      AZURE_KV_NAME:   ${{ vars.AZURE_KV_NAME }}
      AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
      # ── Huawei Cloud ───────────────────────────────────────────────────
      HW_REGION:              ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
      HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
      HW_CSMS_SECRET:         ${{ vars.HW_CSMS_SECRET || 'AuditPassword' }}
      HW_ECS_TAG_KEY:         ${{ vars.HW_ECS_TAG_KEY || '' }}
      HW_ECS_TAG_VAL:         ${{ github.event.inputs.environment_tag == 'all' && '' || github.event.inputs.environment_tag }}
      HW_VPC_ID:              ${{ vars.HW_VPC_ID }}
      HW_EPS_ID:              ${{ vars.HW_EPS_ID }}
      HW_VPC_ENDPOINT:           ${{ vars.HW_VPC_ENDPOINT || format('https://vpc.{0}.alphaedge.tmone.com.my', vars.HW_REGION || 'my-kualalumpur-1') }}
      HUAWEICLOUD_ACCESS_KEY:  ${{ secrets.HW_ACCESS_KEY }}
      HUAWEICLOUD_SECRET_KEY:  ${{ secrets.HW_SECRET_KEY }}
      HUAWEICLOUD_REGION:     ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
      # Explicit private endpoint — consumed by multi_os_benchmark.sh and
      # hw_ecs_discover.py. Auto-derived from HW_REGION if not set here,
      # but setting it explicitly avoids any ambiguity.
      HW_ECS_ENDPOINT:        "https://ecs.${{ vars.HW_REGION || 'my-kualalumpur-1' }}.alphaedge.tmone.com.my"
      # ── Shared ─────────────────────────────────────────────────────────
      LINUX_ADMIN_USER:     ${{ vars.LINUX_ADMIN_USER }}
      WINDOWS_ADMIN_USER:   ${{ vars.WINDOWS_ADMIN_USER }}
      WIN_SERVER_ROLE:      ${{ vars.WIN_SERVER_ROLE || 'member_server' }}
      ORG_NAME:             ${{ vars.ORG_NAME }}
      ORG_PREFIX:           ${{ vars.ORG_PREFIX }}
      GHOST_USER:           ${{ vars.GHOST_USER }}
      CUSTOM_XCCDF_PROFILE: ${{ vars.CUSTOM_XCCDF_PROFILE }}
      AUDIT_PASS:           ${{ secrets.AUDIT_PASS }}
      TICKET_ID:            ${{ github.event.inputs.ticket_id }}
      DEBUG_MODE:           ${{ github.event.inputs.debug_mode }}
      CLEANUP:              ${{ github.event.inputs.cleanup_mode }}

    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4

      # ── Azure auth ──────────────────────────────────────────────────────
      - name: '🔐 [Azure] Login'
        if: needs.prepare-queue.outputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      # ── Huawei Cloud auth ───────────────────────────────────────────────
      # FIX: hcloud (KooCLI) removed. SDK install + auth verify here gives an
      # early fail before the main script runs, so errors are clearly diagnosed.
      # multi_os_benchmark.sh also calls cloud_hcloud_check() at Phase 0.3
      # (which uses the same SDK path), so auth is double-verified.
      - name: '🔐 [HuaweiCloud] Install SDK & Verify Auth'
        if: needs.prepare-queue.outputs.cloud == 'huaweicloud'
        env:
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          HW_REGION:              ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
          HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
        run: |
          echo "📦 Installing Huawei Cloud Python SDK..."
          pip install huaweicloudsdkcore huaweicloudsdkecs huaweicloudsdkvpc --quiet

          echo "🔍 Verifying AK/SK against private ECS endpoint..."
          export HW_ECS_ENDPOINT="https://ecs.${HW_REGION}.alphaedge.tmone.com.my"

          python3 - <<'PYEOF'
          import os, sys
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkecs.v2 import EcsClient, ListServersDetailsRequest
          from huaweicloudsdkcore.exceptions import exceptions

          ak         = os.environ["HUAWEICLOUD_ACCESS_KEY"]
          sk         = os.environ["HUAWEICLOUD_SECRET_KEY"]
          project_id = os.environ["HW_PROJECT_ID"]
          endpoint   = os.environ["HW_ECS_ENDPOINT"]

          try:
              client = EcsClient.new_builder() \
                  .with_credentials(BasicCredentials(ak, sk, project_id)) \
                  .with_endpoint(endpoint) \
                  .build()
              resp  = client.list_servers_details(ListServersDetailsRequest())
              count = len(resp.servers) if resp.servers else 0
              print(f"✅ [HuaweiCloud] SDK auth OK — {count} ECS instance(s) visible")
              print(f"   endpoint: {endpoint}")
          except exceptions.ClientRequestException as e:
              print(f"❌ SDK auth failed: {e.status_code} {e.error_code} {e.error_msg}",
                    file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"❌ Unexpected error: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      # ── SSH (Linux only) ────────────────────────────────────────────────
      # Key-only, for both clouds. Azure trusts the runner's public key via
      # `az vm run-command` (an out-of-band control-plane channel — see
      # cloud_vm_run_shell in multi_os_benchmark.sh), which works even on a
      # brand-new VM with no prior SSH access. Huawei Cloud has no such
      # channel, so its VMs must already trust this same public key for
      # LINUX_ADMIN_USER — provisioned via cloud-init/user-data at ECS
      # creation time (baked into the golden image), not injected here.
      # No password secret is used — VM_SSH_PASSWORD has been removed.
      - name: '🔑 Setup SSH Key'
        if: matrix.os_target.os != 'Windows'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}

      - name: '🔓 Extract Public Key'
        if: matrix.os_target.os != 'Windows'
        run: |
          mkdir -p ~/.ssh
          ssh-add -L > ~/.ssh/id_rsa.pub

      # ── Linux toolchain ─────────────────────────────────────────────────
      # FIX: pip install for the HW SDK is included here so multi_os_benchmark.sh
      # can call hw_ecs_discover.py at runtime (Phase 0.1 discovery + Phase 0.3
      # cloud_hcloud_check). The auth step above already installs it for HW runs,
      # but this step runs for ALL OS targets — duplicating is cheap and safe.
      - name: '🛠️ Install Linux Tools (Ansible + HW SDK)'
        if: matrix.os_target.os != 'Windows'
        run: |
          sudo apt-get update -qq
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user 'ansible>=10.0.0,<11.0.0'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo sh -c 'printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" >> /etc/ssh/ssh_config'

          if [ "$CLOUD_PROVIDER" == "huaweicloud" ]; then
            echo "📦 Installing Huawei Cloud Python SDK for runtime use..."
            pip install huaweicloudsdkcore huaweicloudsdkecs huaweicloudsdkvpc --quiet
            python3 -c "import huaweicloudsdkecs; print('✅ SDK import OK')"
          fi


      # ── Windows toolchain ───────────────────────────────────────────────
      - name: '🛠️ Install Windows Tools (Cinc Auditor + Ansible + pywinrm)'
        if: matrix.os_target.os == 'Windows'
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user 'ansible>=10.0.0,<11.0.0' pywinrm requests
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          sudo ln -sf /usr/bin/cinc-auditor /usr/bin/inspec

          # SDK also required for Windows jobs — cloud_hcloud_check() in Phase 0.3
          # runs regardless of OS target and imports huaweicloudsdkecs.
          if [ "$CLOUD_PROVIDER" == "huaweicloud" ]; then
            echo "📦 Installing Huawei Cloud Python SDK for runtime use..."
            pip install huaweicloudsdkcore huaweicloudsdkecs huaweicloudsdkvpc --quiet
            python3 -c "import huaweicloudsdkecs; print('✅ SDK import OK')"
          fi

      # ── CIS WS2022 v5 profile validation ───────────────────────────────
      - name: '🗂️ Validate CIS WS2022 v5 Profile'
        if: matrix.os_target.os == 'Windows'
        run: |
          PROFILE_DIR="window-default-cis/window-baseline"
          RB_FILE="${PROFILE_DIR}/controls/cis_ws2022_v5_0_0_benchmark.rb"
          YML_FILE="${PROFILE_DIR}/inspec.yml"
          PS1_FILE="${PROFILE_DIR}/Invoke-CISRemediation-Combined.ps1"
          FAIL=0

          [ ! -f "$YML_FILE" ] && { echo "❌ Missing: $YML_FILE"; FAIL=1; } || echo "✅ $YML_FILE"
          if [ ! -f "$RB_FILE" ]; then
            echo "❌ Missing: $RB_FILE"; FAIL=1
          else
            CTRL=$(grep -c "^control " "$RB_FILE" || true)
            L1=$(grep -c "tag level: \['L1'\]" "$RB_FILE" || true)
            L2=$(grep -c "tag level: \['L2'\]" "$RB_FILE" || true)
            echo "✅ $RB_FILE (${CTRL} controls: L1=${L1}, L2=${L2})"
          fi
          [ ! -f "$PS1_FILE" ] \
            && echo "⚠️  Missing: $PS1_FILE (PS1 fallback unavailable)" \
            || echo "✅ $PS1_FILE"

          if [ "$CLOUD_PROVIDER" == "huaweicloud" ]; then
            echo ""
            echo "ℹ️  Huawei Cloud notes:"
            echo "   • PS1 remediation via agent channel NOT available"
            echo "   • Remediation runs via Ansible playbook only"
            echo "   • Set WIN_REBOOT_AFTER_REMEDIATION=false in .env / repo vars"
          fi

          [ $FAIL -eq 1 ] && exit 1
          echo "✅ Profile ready | server_role=$WIN_SERVER_ROLE"

      # ── Ansible CIS role ────────────────────────────────────────────────
      - name: '📦 Install Ansible CIS Role (Windows)'
        if: matrix.os_target.os == 'Windows'
        run: |
          ansible-galaxy role install -r requirements.yml \
            || ansible-galaxy role install \
                 git+https://github.com/ansible-lockdown/Windows-2022-CIS.git \
            && echo "✅ WS2022 role ready"

      # ── MAIN EXECUTION ──────────────────────────────────────────────────
      - name: '🚀 Execute Fleet Commander'
        run: |
          echo "☁️  Cloud Provider         : $CLOUD_PROVIDER"
          echo "🎯 Targeting Environment : $TARGET_ENV"
          echo "🖥️  Assigned OS Runner   : $TARGET_OS ($TARGET_IP)"
          echo "🛡️  WIN_SERVER_ROLE      : $WIN_SERVER_ROLE"
          echo "📋 Running Profile       : $PROFILE"
          [ "$CLOUD_PROVIDER" == "huaweicloud" ] && \
            echo "🌐 HW_ECS_ENDPOINT       : $HW_ECS_ENDPOINT"
          chmod +x multi_os_benchmark.sh

          BASE_ARGS=(
            --headless
            --cloud     "$CLOUD_PROVIDER"
            --mode      "$MODE"
            --targets   "$TARGET_ENV"
            --ticket    "${TICKET_ID:-None}"
            --debug     "${DEBUG_MODE:-false}"
            --cleanup   "${CLEANUP:-false}"
            --target-os "$TARGET_OS"
            --target-ip "$TARGET_IP"
          )

          if [ "$PROFILE" == "all" ]; then
            echo "🚀 FULL AUDIT MODE"
            ./multi_os_benchmark.sh "${BASE_ARGS[@]}" --profile "all"
          else
            ./multi_os_benchmark.sh "${BASE_ARGS[@]}" --profile "$PROFILE"
          fi

      # ── Artifacts ───────────────────────────────────────────────────────
      - name: '🔎 Verify Report Generation'
        id: check_reports
        run: |
          COUNT=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.json" \) | wc -l)
          echo "📊 Reports found: $COUNT"
          echo "has_reports=$( [ "$COUNT" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: '💾 Save Reports'
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            temp-reports-${{ matrix.os_target.os }}-${{ matrix.os_target.ip }}-${{ env.MATRIX_NAME }}-${{ needs.prepare-queue.outputs.cloud }}
          path: |
            *.html
            *.json
          if-no-files-found: warn
          retention-days: 1


# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — FAN-IN: aggregate all matrix artifacts into one release
# ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    needs: run-audit
    if: always() && needs.run-audit.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: '🕒 Set Release Variables'
        run: |
          echo "DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          PROFILE_RAW="${{ github.event.inputs.profile }}"
          LEVEL="${{ github.event.inputs.cis_level }}"
          CLOUD="${{ github.event.inputs.cloud_provider || 'azure' }}"
          if [[ "$PROFILE_RAW" == *"all"* ]]; then
            echo "DISPLAY_PROFILE=Full Audit (CIS L1 + CIS L2 + TM)" >> $GITHUB_ENV
          elif [[ "$PROFILE_RAW" == *"cis"* ]]; then
            echo "DISPLAY_PROFILE=CIS Benchmark ($LEVEL)" >> $GITHUB_ENV
          else
            echo "DISPLAY_PROFILE=TM Custom Baseline" >> $GITHUB_ENV
          fi
          echo "DISPLAY_CLOUD=${CLOUD^^}" >> $GITHUB_ENV

      - name: '📥 Download All Artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: temp-reports-*
          path: consolidated-evidence

      - name: '🗂️ Organize by Machine IP'
        run: |
          cd consolidated-evidence
          find . -maxdepth 2 -type f \( -name "*.html" -o -name "*.json" \) | while read -r file; do
            BASENAME=$(basename "$file")
            IP=$(echo "$BASENAME" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
            [ -z "$IP" ] && IP="unknown-node"
            if   [[ "$BASENAME" == *"CIS_L1"* ]]; then PDIR="CIS Level 1"
            elif [[ "$BASENAME" == *"CIS_L2"* ]]; then PDIR="CIS Level 2"
            else                                       PDIR="TM Baseline"
            fi
            mkdir -p "$IP/$PDIR"
            mv "$file" "$IP/$PDIR/"
          done
          find . -maxdepth 1 -type d -name "temp-reports-*" -exec rm -rf {} +

      - name: '📦 Zip Evidence Package'
        run: |
          cd consolidated-evidence
          zip -r ../Fleet_Compliance_Evidence_${{ env.DATE_TAG }}.zip .

      - name: '📢 Publish GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Audit-Run-${{ github.run_number }}
          name: "🛡️ Fleet Audit: ${{ env.DISPLAY_PROFILE }} [${{ env.DISPLAY_CLOUD }}] (#${{ github.run_number }})"
          body: |
            ## 📊 Fleet-Wide Security Audit
            **Date:** `${{ env.DATE_TAG }}`
            **Cloud Provider:** `${{ env.DISPLAY_CLOUD }}`
            **Ticket ID:** `${{ github.event.inputs.ticket_id || 'N/A' }}`
            **Target Environment:** `${{ github.event.inputs.environment_tag }}`
            **Execution Mode:** `${{ github.event.inputs.mode }}`
            **Strategy:** `${{ github.event.inputs.execution_strategy }}`
            **Profile:** `${{ env.DISPLAY_PROFILE }}`

            All matrix reports aggregated and categorized by Machine IP.
            📥 **Download the ZIP below for HTML and JSON reports.**
          files: Fleet_Compliance_Evidence_*.zip
