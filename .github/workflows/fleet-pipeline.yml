name: 🛡️ Fleet Commander Pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '🛡️ STEP 1: Select Security Profile (Choose "all" for full audit)'
        required: true
        default: 'tm'
        type: choice
        options:
          - tm
          - cis
          - all(only work for scanning only)
      cis_level:
        description: '📊 STEP 2: CIS Strictness (Only matters for "cis" profile)'
        required: true
        type: choice
        default: 'Level 1'
        options:
          - 'Level 1'
          - 'Level 2'
      mode:
        description: '🚀 STEP 3: Action Mode (Scan = Read-Only | Remediate = Fix)'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - full
      environment_tag:
        description: '🎯 STEP 4: Target Environment (Blast Radius)'
        required: true
        default: 'all'
        type: choice
        options:
          - Dev
          - Staging
          - Prod
          - all
      ticket_id:
        description: '🎫 Change Request / Jira Ticket ID'
        required: false
        type: string
      debug_mode:
        description: '🐞 Troubleshooting: Enable Verbose Logs'
        required: false
        default: false
        type: boolean
      cleanup_mode:
        description: '🧹 Post-Scan: Delete tools from target servers'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 18 * * 5'

  repository_dispatch:
    types: [new_vm_provisioned]

permissions:
  contents: write

jobs:
  # 🏭 JOB 1: THE MATRIX FACTORY (Builds the JSON Queue)
  prepare-queue:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      safe_mode: ${{ steps.safety-gate.outputs.safe_mode }}
      os_matrix: ${{ steps.discover-vms.outputs.os_matrix }} 
    steps:
      - name: '🛡️ Safety Gate: Blast Radius Control'
        id: safety-gate
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          MODE="${{ github.event.inputs.mode }}"
          
          if [[ "$PROFILE" == *"all"* ]] && [ "$MODE" != "scan" ]; then
            echo "⚠️ SAFETY WARNING: Mass remediation on 'all' profiles is blocked."
            echo "safe_mode=scan" >> $GITHUB_OUTPUT
          else
            echo "safe_mode=$MODE" >> $GITHUB_OUTPUT
          fi

      - name: '🚦 Build Dynamic Profile Matrix JSON'
        id: build-matrix
        run: |
          PROFILE_RAW="${{ github.event.inputs.profile }}"
          LEVEL="${{ github.event.inputs.cis_level }}"
          
          if [[ "$PROFILE_RAW" == *"all"* ]]; then
            # 🚨 Set profile to 'all' - the runner will catch this and execute 3 times
            echo 'matrix=[{"profile":"all","level":"all","name":"Full-Fleet-Audit"}]' >> $GITHUB_OUTPUT
            
          elif [[ "$PROFILE_RAW" == *"cis"* ]]; then
            FORMATTED_LEVEL=$(echo "$LEVEL" | tr ' ' '-')
            echo "matrix=[{\"profile\":\"cis\",\"level\":\"$LEVEL\",\"name\":\"CIS-$FORMATTED_LEVEL\"}]" >> $GITHUB_OUTPUT
            
          else
            echo 'matrix=[{"profile":"tm","level":"Level 1","name":"TM-Baseline"}]' >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Login to Azure CLI for OS Discovery
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: '📡 Discover Online Azure VMs (Dynamic OS Matrix)'
        id: discover-vms
        run: |
          TARGET_ENV="${{ github.event.inputs.environment_tag || 'all' }}"
          RG_NAME="${{ vars.AZURE_RG_NAME }}"
          
          echo "📡 Querying Azure for online VMs in [$RG_NAME]..."
          
          if [ "$TARGET_ENV" == "all" ]; then
              VM_DATA=$(az vm list -d -g "$RG_NAME" --query "[?powerState=='VM running'].[storageProfile.osDisk.osType, storageProfile.imageReference.offer, name]" -o tsv)
          else
              VM_DATA=$(az vm list -d -g "$RG_NAME" --query "[?tags.Environment=='$TARGET_ENV' && powerState=='VM running'].[storageProfile.osDisk.osType, storageProfile.imageReference.offer, name]" -o tsv)
          fi

          HAS_UBUNTU=false; HAS_RHEL=false; HAS_ROCKY=false; HAS_WINDOWS=false

          while IFS=$'\t' read -r os offer name; do
              offer_lower="${offer,,}"
              name_lower="${name,,}"
              
              if [[ "$os" == *"Linux"* ]] || [[ "$os" == *"Ubuntu"* ]]; then
                  if [[ "$offer_lower" == *"rocky"* ]] || [[ "$name_lower" == *"rocky"* ]]; then HAS_ROCKY=true
                  elif [[ "$offer_lower" == *"rhel"* ]] || [[ "$name_lower" == *"rhel"* ]]; then HAS_RHEL=true
                  else HAS_UBUNTU=true
                  fi
              elif [[ "$os" == *"Windows"* ]]; then
                  HAS_WINDOWS=true
              fi
          done <<< "$VM_DATA"

          OS_JSON="["
          [ "$HAS_UBUNTU" == true ] && OS_JSON+="\"Ubuntu\","
          [ "$HAS_RHEL" == true ] && OS_JSON+="\"RHEL\","
          [ "$HAS_ROCKY" == true ] && OS_JSON+="\"Rocky\","
          [ "$HAS_WINDOWS" == true ] && OS_JSON+="\"Windows\","

          OS_JSON="${OS_JSON%,}]"
          if [ "$OS_JSON" == "]" ]; then OS_JSON="[]"; fi

          echo "✅ Active OSes discovered: $OS_JSON"
          echo "os_matrix=$OS_JSON" >> $GITHUB_OUTPUT

  # 🚀 JOB 2: THE 2D EXECUTION ENGINE (Profiles x Operating Systems)
  run-audit:
    needs: prepare-queue
    if: ${{ needs.prepare-queue.outputs.os_matrix != '[]' }} 
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false      
      matrix:
        target: ${{ fromJSON(needs.prepare-queue.outputs.matrix) }}
        os_target: ${{ fromJSON(needs.prepare-queue.outputs.os_matrix) }} 

    env:
      TARGET_ENV: ${{ github.event.inputs.environment_tag || 'Prod' }}
      MODE: ${{ needs.prepare-queue.outputs.safe_mode }}
      PROFILE: ${{ matrix.target.profile }}
      CIS_LEVEL: ${{ matrix.target.level }}
      MATRIX_NAME: ${{ matrix.target.name }}
      TARGET_OS: ${{ matrix.os_target }}

    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🔑 Setup SSH Key for Ubuntu/RHEL Targets
        if: matrix.os_target != 'Windows'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}
          
      - name: 🔓 Extract Public Key for Auto-Healing
        if: matrix.os_target != 'Windows'
        run: |
          mkdir -p ~/.ssh
          ssh-add -L > ~/.ssh/id_rsa.pub

      - name: 🛠️ Install Linux Tools (OpenSCAP)
        if: matrix.os_target != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscap-scanner openscap-utils sshpass
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo sh -c 'printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" >> /etc/ssh/ssh_config'
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: 🛠️ Install Windows Tools (Cinc Auditor & WinRM)
        if: matrix.os_target == 'Windows'
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible pywinrm requests
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          sudo ln -sf /usr/bin/cinc-auditor /usr/bin/inspec

      - name: 🚀 Execute Fleet Commander
        env:
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          AZURE_KV_NAME: ${{ vars.AZURE_KV_NAME }}
          AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
          LINUX_ADMIN_USER: ${{ vars.LINUX_ADMIN_USER }}
          WINDOWS_ADMIN_USER: ${{ vars.WINDOWS_ADMIN_USER }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          ORG_PREFIX: ${{ vars.ORG_PREFIX }}
          GHOST_USER: ${{ vars.GHOST_USER }}
          CUSTOM_XCCDF_PROFILE: ${{ vars.CUSTOM_XCCDF_PROFILE }}
          TICKET_ID: ${{ github.event.inputs.ticket_id }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          CLEANUP: ${{ github.event.inputs.cleanup_mode }}
        run: |
          echo "🎯 Targeting Environment: $TARGET_ENV"
          echo "🖥️  Assigned OS Runner: $TARGET_OS"
          chmod +x multi_os_benchmark.sh
          
          # 🚨 SINGLE RUN FOR FULL AUDITS
          if [ "$PROFILE" == "all" ]; then
            echo "🚀 FULL AUDIT MODE: Executing comprehensive internal scan loop..."
            ./multi_os_benchmark.sh --headless --profile "all" --mode "$MODE" --targets "$TARGET_ENV" --ticket "$TICKET_ID" --debug "$DEBUG_MODE" --cleanup "$CLEANUP" --target-os "$TARGET_OS"
          else
            echo "📋 Running Single Profile: $PROFILE"
            ./multi_os_benchmark.sh --headless --profile "$PROFILE" --mode "$MODE" --targets "$TARGET_ENV" --ticket "$TICKET_ID" --debug "$DEBUG_MODE" --cleanup "$CLEANUP" --target-os "$TARGET_OS"
          fi
      
      - name: 🔎 Verify Report Generation
        id: check_reports
        run: |
          REPORT_COUNT=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.json" \) | wc -l)
          if [ "$REPORT_COUNT" -gt 0 ]; then
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Save Reports as Temporary Artifacts
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temp-reports-${{ matrix.os_target }}-${{ env.MATRIX_NAME }}
          path: |
            **/*.html
            **/*.json
          retention-days: 1

  # 🏆 JOB 3: THE FAN-IN (Gathers all matrix data into one Zip & Release)
  publish-release:
    needs: run-audit 
    if: always() && needs.run-audit.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: 🕒 Set Up Release Variables
        run: |
          echo "DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          
          PROFILE_RAW="${{ github.event.inputs.profile }}"
          LEVEL="${{ github.event.inputs.cis_level }}"
          
          if [[ "$PROFILE_RAW" == *"all"* ]]; then
            echo "DISPLAY_PROFILE=Full Audit (CIS L1, CIS L2 & TM)" >> $GITHUB_ENV
          elif [[ "$PROFILE_RAW" == *"cis"* ]]; then
            echo "DISPLAY_PROFILE=CIS Benchmark ($LEVEL)" >> $GITHUB_ENV
          else
            echo "DISPLAY_PROFILE=TM Custom Baseline" >> $GITHUB_ENV
          fi

      - name: 📥 Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: temp-reports-*
          path: consolidated-evidence

      - name: 🗂️ Organize Folders by Machine IP and Profile
        run: |
          cd consolidated-evidence
          
          # 1. Loop through every single file inside the messy artifact folders
          find temp-reports-*/ -type f | while read file; do
            BASENAME=$(basename "$file")
            
            # 2. Extract the IP Address using bash string manipulation
            FILENAME_NO_EXT="${BASENAME%.*}"
            IP_ADDR="${FILENAME_NO_EXT##*_}"
            
            # 3. Determine the correct Profile folder based on the filename
            if [[ "$BASENAME" == *"CIS_L1"* ]]; then
              PROFILE_DIR="CIS (Level 1)"
            elif [[ "$BASENAME" == *"CIS_L2"* ]]; then
              PROFILE_DIR="CIS (Level 2)"
            elif [[ "$BASENAME" == *"TM_"* ]]; then
              PROFILE_DIR="TM Baseline"
            else
              PROFILE_DIR="Other"
            fi
            
            # 4. Create the target Machine/Profile directory and move the file
            mkdir -p "$IP_ADDR/$PROFILE_DIR"
            mv "$file" "$IP_ADDR/$PROFILE_DIR/"
          done
          
          # 5. Delete all the old, empty temp-reports folders
          rm -rf temp-reports-*

      - name: 📦 Zip the Evidence Package
        run: |
          cd consolidated-evidence
          zip -r ../Fleet_Compliance_Evidence_${{ env.DATE_TAG }}.zip .

      - name: 📢 Publish Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Audit-Run-${{ github.run_number }}
          name: "🛡️ Fleet Compliance Audit: ${{ env.DISPLAY_PROFILE }} (#${{ github.run_number }})"
          body: |
            ## 📊 Fleet-Wide Security Audit
            **Date:** `${{ env.DATE_TAG }}`
            **Ticket ID:** `${{ github.event.inputs.ticket_id || 'N/A' }}`
            **Target Environment:** `${{ github.event.inputs.environment_tag }}`
            **Execution Mode:** `${{ github.event.inputs.mode }}`
            **Compliance Profile:** `${{ env.DISPLAY_PROFILE }}`
            
            All matrix execution reports have been successfully aggregated and categorized by Machine IP and Profile into the attached Evidence ZIP archive.
            
            📥 **Download the ZIP below to access the HTML and JSON reports.**
          files: Fleet_Compliance_Evidence_*.zip
