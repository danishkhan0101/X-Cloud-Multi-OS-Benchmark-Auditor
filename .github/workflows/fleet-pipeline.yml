name: 🛡️ Fleet Commander Pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '🛡️ STEP 1: Select Security Profile (Choose "all" for full audit)'
        required: true
        default: 'tm'
        type: choice
        options:
          - tm
          - cis
          - all
      cis_level:
        description: '📊 STEP 2: CIS Strictness (Only matters for "cis" profile)'
        required: true
        type: choice
        default: 'Level 1'
        options:
          - 'Level 1'
          - 'Level 2'
      mode:
        description: '🚀 STEP 3: Action Mode (Scan = Read-Only | Remediate = Fix)'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - remediate
          - full
      environment_tag:
        description: '🎯 STEP 4: Target Environment (Blast Radius)'
        required: true
        default: 'all'
        type: choice
        options:
          - Dev
          - Staging
          - Prod
          - all
      ticket_id:
        description: '🎫 Change Request / Jira Ticket ID'
        required: false
        type: string
      debug_mode:
        description: '🐞 Troubleshooting: Enable Verbose Logs'
        required: false
        default: false
        type: boolean
      cleanup_mode:
        description: '🧹 Post-Scan: Delete tools from target servers'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 18 * * 5'

  repository_dispatch:
    types: [new_vm_provisioned]

permissions:
  contents: write

jobs:
  # 🏭 JOB 1: THE MATRIX FACTORY (Builds the JSON Queue)
  prepare-queue:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      safe_mode: ${{ steps.safety-gate.outputs.safe_mode }}
    steps:
      - name: '🛡️ Safety Gate: Blast Radius Control'
        id: safety-gate
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          MODE="${{ github.event.inputs.mode }}"
          
          if [ "$PROFILE" == "all" ] && [ "$MODE" != "scan" ]; then
            echo "⚠️ SAFETY WARNING: Mass remediation on 'all' profiles is blocked."
            echo "safe_mode=scan" >> $GITHUB_OUTPUT
          else
            echo "safe_mode=$MODE" >> $GITHUB_OUTPUT
          fi

      - name: '🚦 Build Dynamic Matrix JSON'
        id: build-matrix
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          LEVEL="${{ github.event.inputs.cis_level }}"
          
          if [ "$PROFILE" == "all" ]; then
            echo 'matrix=[{"profile":"cis","level":"Level 1","name":"CIS-L1"},{"profile":"cis","level":"Level 2","name":"CIS-L2"},{"profile":"both","level":"Level 1","name":"TM-Baseline"}]' >> $GITHUB_OUTPUT
          elif [ "$PROFILE" == "cis" ]; then
            FORMATTED_LEVEL=$(echo "$LEVEL" | tr ' ' '-')
            echo "matrix=[{\"profile\":\"cis\",\"level\":\"$LEVEL\",\"name\":\"CIS-$FORMATTED_LEVEL\"}]" >> $GITHUB_OUTPUT
          else
            echo 'matrix=[{"profile":"tm","level":"Level 1","name":"TM-Baseline"}]' >> $GITHUB_OUTPUT
          fi

  # 🚀 JOB 2: THE 2D EXECUTION ENGINE (Profiles x Operating Systems)
  run-audit:
    needs: prepare-queue
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false      
      matrix:
        target: ${{ fromJSON(needs.prepare-queue.outputs.matrix) }}
        # 🚨 ADD ROCKY HERE
        os_target: [Ubuntu, RHEL, Rocky, Windows]

    env:
      TARGET_ENV: ${{ github.event.inputs.environment_tag || 'Prod' }}
      MODE: ${{ needs.prepare-queue.outputs.safe_mode }}
      PROFILE: ${{ matrix.target.profile }}
      CIS_LEVEL: ${{ matrix.target.level }}
      MATRIX_NAME: ${{ matrix.target.name }}
      TARGET_OS: ${{ matrix.os_target }} # 🚨 Expose Matrix OS to Bash

    steps:
      - name: 📥 Pull Repository Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Azure CLI
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🔑 Setup SSH Key for Ubuntu/RHEL Targets
        if: matrix.os_target != 'Windows'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}
          
      - name: 🔓 Extract Public Key for Auto-Healing
        if: matrix.os_target != 'Windows'
        run: |
          mkdir -p ~/.ssh
          ssh-add -L > ~/.ssh/id_rsa.pub

      - name: 🛠️ Install Linux Tools (OpenSCAP)
        if: matrix.os_target != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscap-scanner openscap-utils sshpass
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo sh -c 'printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" >> /etc/ssh/ssh_config'
          export ANSIBLE_HOST_KEY_CHECKING=False

      - name: 🛠️ Install Windows Tools (Cinc Auditor & WinRM)
        if: matrix.os_target == 'Windows'
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible pywinrm requests
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          sudo ln -sf /usr/bin/cinc-auditor /usr/bin/inspec

      - name: 🚀 Execute Fleet Commander
        env:
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          AZURE_KV_NAME: ${{ vars.AZURE_KV_NAME }}
          AZURE_KV_SECRET: ${{ vars.AZURE_KV_SECRET }}
          LINUX_ADMIN_USER: ${{ vars.LINUX_ADMIN_USER }}
          WINDOWS_ADMIN_USER: ${{ vars.WINDOWS_ADMIN_USER }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          ORG_PREFIX: ${{ vars.ORG_PREFIX }}
          GHOST_USER: ${{ vars.GHOST_USER }}
          CUSTOM_XCCDF_PROFILE: ${{ vars.CUSTOM_XCCDF_PROFILE }}
          TICKET_ID: ${{ github.event.inputs.ticket_id }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          CLEANUP: ${{ github.event.inputs.cleanup_mode }}
        run: |
          echo "🎯 Targeting Environment: $TARGET_ENV"
          echo "📋 Running Profile: $PROFILE in Mode: $MODE"
          echo "🖥️  Assigned OS Runner: $TARGET_OS"
          
          chmod +x multi_os_benchmark.sh
          # 🚨 Pass the dynamic --target-os flag to the bash script
          ./multi_os_benchmark.sh --headless --profile "$PROFILE" --mode "$MODE" --targets "$TARGET_ENV" --ticket "$TICKET_ID" --debug "$DEBUG_MODE" --cleanup "$CLEANUP" --target-os "$TARGET_OS"
      
      - name: 🏷️ Generate Version Tag
        id: versioning
        run: echo "DATE_TAG=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: 🔎 Verify Report Generation
        id: check_reports
        run: |
          REPORT_COUNT=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.json" \) | wc -l)
          if [ "$REPORT_COUNT" -gt 0 ]; then
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: 🕒 Generate Dynamic Timestamp
        if: steps.check_reports.outputs.has_reports == 'true'
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: 🧹 Configure Release Variables (Collision-Proof)
        if: steps.check_reports.outputs.has_reports == 'true'
        run: |
          # 🚨 Added OS to release tag so parallel jobs don't overwrite each other
          echo "RELEASE_TAG=audit-${{ env.TIMESTAMP }}-${{ env.MATRIX_NAME }}-${{ matrix.os_target }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Fleet Audit (${{ matrix.os_target }}) - ${{ env.MATRIX_NAME }}" >> $GITHUB_ENV
          if [ "${{ env.PROFILE }}" == "tm" ] || [ "${{ env.PROFILE }}" == "both" ]; then
            echo "CIS_DISPLAY=" >> $GITHUB_ENV
          else
            echo "CIS_DISPLAY=**CIS Level:** \`${{ env.CIS_LEVEL }}\`" >> $GITHUB_ENV
          fi

      - name: 📢 Publish OS-Specific GitHub Release
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## 📊 DevSecOps Audit Execution (${{ matrix.os_target }})
            **Ticket ID:** `${{ github.event.inputs.ticket_id }}`
            **Target Environment:** `${{ env.TARGET_ENV }}`
            **Compliance Profile:** `${{ env.PROFILE }}`
            **Execution Mode:** `${{ env.MODE }}`
            ${{ env.CIS_DISPLAY }}
          files: |
            **/*.html
            **/*.json

      - name: 💾 Save JSON Reports for Dashboard
        if: steps.check_reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v4
        with:
          # 🚨 Dynamically name the artifact so they don't overwrite each other
          name: raw-json-${{ env.MATRIX_NAME }}-${{ matrix.os_target }}
          path: '**/*.json'
          retention-days: 1
