name: 🔍 Debug - Huawei Cloud SG Rule SDK Methods

on:
  workflow_dispatch:
    inputs:
      security_group_id:
        description: '(Optional) Real SG ID to test List against — leave blank to only inspect SDK methods'
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect-vpc-sdk:
    runs-on: ubuntu-latest
    env:
      HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
      HW_REGION:              ${{ vars.HW_REGION || 'my-kualalumpur-1' }}
      HW_VPC_ENDPOINT:        ${{ vars.HW_VPC_ENDPOINT }}  # e.g. https://vpc.my-kualalumpur-1.alphaedge.tmone.com.my

    steps:
      - name: '📦 Install Huawei Cloud VPC SDK'
        run: |
          pip install huaweicloudsdkcore huaweicloudsdkvpc --quiet
          python3 -c "import huaweicloudsdkvpc; print('✅ huaweicloudsdkvpc import OK')"

      - name: '📜 List all client methods on VpcClient (security-group related)'
        run: |
          python3 - <<'PYEOF'
          from huaweicloudsdkvpc.v2 import VpcClient

          methods = [m for m in dir(VpcClient) if not m.startswith('_')]
          sg_methods = [m for m in methods if 'security_group' in m.lower()]

          print("=== ALL VpcClient methods containing 'security_group' ===")
          for m in sorted(sg_methods):
              print(" -", m)

          print("")
          print("=== ALL VpcClient methods (full list, for reference) ===")
          for m in sorted(methods):
              print(" -", m)
          PYEOF

      - name: '📖 Inspect request/response models for likely List/Delete calls'
        run: |
          python3 - <<'PYEOF'
          import importlib

          candidates_list = [
              "ListSecurityGroupRulesRequest",
              "ListSecurityGroupRuleRequest",
          ]
          candidates_delete = [
              "DeleteSecurityGroupRuleRequest",
          ]

          mod = importlib.import_module("huaweicloudsdkvpc.v2")

          print("=== Checking for List request models ===")
          for name in candidates_list:
              obj = getattr(mod, name, None)
              if obj:
                  print(f"✅ Found: {name}")
                  print("   Fields:", [f for f in dir(obj) if not f.startswith('_')])
              else:
                  print(f"❌ Not found: {name}")

          print("")
          print("=== Checking for Delete request models ===")
          for name in candidates_delete:
              obj = getattr(mod, name, None)
              if obj:
                  print(f"✅ Found: {name}")
                  print("   Fields:", [f for f in dir(obj) if not f.startswith('_')])
              else:
                  print(f"❌ Not found: {name}")
          PYEOF

      - name: '🧪 Live test — List rules against a real SG (read-only, optional)'
        if: ${{ github.event.inputs.security_group_id != '' }}
        run: |
          python3 - <<'PYEOF'
          import os
          import json
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkcore.exceptions import exceptions
          from huaweicloudsdkvpc.v2 import VpcClient, ListSecurityGroupRulesRequest

          ak         = os.environ["HUAWEICLOUD_ACCESS_KEY"]
          sk         = os.environ["HUAWEICLOUD_SECRET_KEY"]
          project_id = os.environ["HW_PROJECT_ID"]
          endpoint   = os.environ.get("HW_VPC_ENDPOINT", "")
          sg_id      = "${{ github.event.inputs.security_group_id }}"

          if not endpoint:
              print("❌ HW_VPC_ENDPOINT not set — set it as a repo variable, e.g.")
              print("   https://vpc.my-kualalumpur-1.alphaedge.tmone.com.my")
              exit(1)

          try:
              client = (
                  VpcClient.new_builder()
                  .with_credentials(BasicCredentials(ak, sk, project_id))
                  .with_endpoint(endpoint)
                  .build()
              )
              req = ListSecurityGroupRulesRequest()
              req.security_group_id = sg_id
              resp = client.list_security_group_rules(req)

              rules = resp.security_group_rules or []
              print(f"✅ {len(rules)} rule(s) returned")
              if rules:
                  first = rules[0]
                  d = first.to_dict() if hasattr(first, "to_dict") else vars(first)
                  print("First rule fields:", list(d.keys()))
                  print(json.dumps(d, indent=2, default=str))
          except exceptions.ClientRequestException as e:
              print(f"❌ API error {e.status_code}: {e.error_code} — {e.error_msg}")
          except Exception as e:
              print(f"❌ Unexpected error: {e}")
          PYEOF
