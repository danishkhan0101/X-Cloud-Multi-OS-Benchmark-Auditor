name: 🔍 Debug - Huawei Cloud SG Rule Commands

on:
  workflow_dispatch:
    inputs:
      security_group_id:
        description: '(Optional) Real SG ID to test List against — leave blank to only inspect --cli-help'
        required: false
        type: string
      hw_region:
        description: 'Huawei Cloud region'
        required: false
        default: 'my-kualalumpur-1'
        type: string

permissions:
  contents: read

jobs:
  inspect-hcloud-sg-commands:
    runs-on: ubuntu-latest
    steps:
      - name: '📦 Install hcloud (KooCLI)'
        run: |
          curl -sSL https://mirrors.huaweicloud.com/koocli/koocli_install.sh | bash || \
          curl -sSL https://obs-koocli.obs.cn-north-4.myhuaweicloud.com/koocli_install.sh | bash
          echo "$HOME/.hcloud/bin" >> $GITHUB_PATH
          source ~/.bashrc || true
          hcloud --cli-version || true

      - name: '🔐 Configure hcloud credentials'
        env:
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
        run: |
          hcloud configure set \
            --cli-mode=AKSK \
            --cli-access-key="$HUAWEICLOUD_ACCESS_KEY" \
            --cli-secret-key="$HUAWEICLOUD_SECRET_KEY" \
            --cli-region="${{ github.event.inputs.hw_region }}" || true

      - name: '📜 List ALL VPC actions'
        run: |
          echo "=== FULL VPC ACTION LIST ==="
          hcloud VPC --cli-help || true

      - name: '🔎 Grep for security-group-rule related actions'
        run: |
          echo "=== Filtered: 'securitygrouprule' ==="
          hcloud VPC --cli-help | grep -i "securitygrouprule" || echo "No matches for 'securitygrouprule'"
          echo ""
          echo "=== Filtered: 'security' (broader) ==="
          hcloud VPC --cli-help | grep -i "security" || echo "No matches for 'security'"

      - name: '📖 Show --cli-help for likely List action'
        run: |
          for ACTION in ListSecurityGroupRules ListSecurityGroupRuleDetail ShowSecurityGroupRule ListSecurityGroupRuleDetails; do
            echo "=== Trying: hcloud VPC ${ACTION} --cli-help ==="
            hcloud VPC "${ACTION}" --cli-help 2>&1 || echo "  (action not found)"
            echo ""
          done

      - name: '📖 Show --cli-help for likely Delete action'
        run: |
          for ACTION in DeleteSecurityGroupRule RemoveSecurityGroupRule; do
            echo "=== Trying: hcloud VPC ${ACTION} --cli-help ==="
            hcloud VPC "${ACTION}" --cli-help 2>&1 || echo "  (action not found)"
            echo ""
          done

      - name: '📖 Show --cli-help for Create action (already used in script)'
        run: |
          echo "=== hcloud VPC CreateSecurityGroupRule --cli-help ==="
          hcloud VPC CreateSecurityGroupRule --cli-help || true

      - name: '🧪 Live test — List rules against a real SG (read-only, optional)'
        if: ${{ github.event.inputs.security_group_id != '' }}
        run: |
          echo "=== Live ListSecurityGroupRules test against SG: ${{ github.event.inputs.security_group_id }} ==="
          hcloud VPC ListSecurityGroupRules \
            --security_group_id "${{ github.event.inputs.security_group_id }}" \
            --cli-region "${{ github.event.inputs.hw_region }}" \
            --cli-output json | tee /tmp/sg_rules_output.json || true
          echo ""
          echo "=== Field names present in response (top-level keys of first rule) ==="
          python3 /tmp/parse_sg_rules.py

      - name: '📝 Write SG-rule parser script'
        if: ${{ github.event.inputs.security_group_id != '' }}
        run: |
          cat > /tmp/parse_sg_rules.py <<'PYEOF'
          import json

          try:
              with open('/tmp/sg_rules_output.json') as f:
                  d = json.load(f)
              rules = d.get('security_group_rules', d.get('rules', []))
              if rules:
                  print('First rule keys:', list(rules[0].keys()))
                  print('First rule sample:', json.dumps(rules[0], indent=2))
              else:
                  print('No rules returned, or key name differs — inspect raw JSON above.')
          except Exception as e:
              print('Could not parse JSON:', e)
          PYEOF
