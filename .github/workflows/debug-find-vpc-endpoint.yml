name: 🔍 Debug - Find HW_VPC_ENDPOINT

on:
  workflow_dispatch:
    inputs:
      security_group_id:
        description: 'A real SG ID from your Alma VM (get from Huawei console or hw_ecs_discover.py output)'
        required: true
        type: string
      hw_region:
        description: 'Huawei Cloud region'
        required: false
        default: 'my-kualalumpur-1'
        type: string

permissions:
  contents: read

jobs:
  find-vpc-endpoint:
    runs-on: ubuntu-latest
    env:
      HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
      HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
      HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
      HW_REGION:              ${{ github.event.inputs.hw_region }}
      SG_ID:                  ${{ github.event.inputs.security_group_id }}

    steps:
      - name: '📦 Install Huawei Cloud VPC SDK'
        run: |
          pip install huaweicloudsdkcore huaweicloudsdkvpc --quiet
          python3 -c "import huaweicloudsdkvpc; print('✅ SDK import OK')"

      - name: '🔍 Try candidate VPC endpoints'
        run: |
          python3 - <<'PYEOF'
          import os
          from huaweicloudsdkcore.auth.credentials import BasicCredentials
          from huaweicloudsdkcore.exceptions import exceptions
          from huaweicloudsdkvpc.v2 import VpcClient, ListSecurityGroupRulesRequest

          ak         = os.environ["HUAWEICLOUD_ACCESS_KEY"]
          sk         = os.environ["HUAWEICLOUD_SECRET_KEY"]
          project_id = os.environ["HW_PROJECT_ID"]
          region     = os.environ["HW_REGION"]
          sg_id      = os.environ["SG_ID"]

          candidates = [
              f"https://vpc.{region}.alphaedge.tmone.com.my",
              f"https://network.{region}.alphaedge.tmone.com.my",
              f"https://vpcv2.{region}.alphaedge.tmone.com.my",
              f"https://vpc-ext.{region}.alphaedge.tmone.com.my",
              f"https://networkv2.{region}.alphaedge.tmone.com.my",
              f"https://ecs.{region}.alphaedge.tmone.com.my",  # sanity check — some deployments share ECS/VPC on one host
          ]

          print(f"Testing {len(candidates)} candidate endpoints against SG: {sg_id}\n")

          working = []

          for ep in candidates:
              print(f"--- Trying: {ep} ---")
              try:
                  client = (
                      VpcClient.new_builder()
                      .with_credentials(BasicCredentials(ak, sk, project_id))
                      .with_endpoint(ep)
                      .build()
                  )
                  req = ListSecurityGroupRulesRequest()
                  req.security_group_id = sg_id
                  resp = client.list_security_group_rules(req)
                  rules = resp.security_group_rules or []
                  print(f"✅ SUCCESS — {len(rules)} rule(s) returned\n")
                  working.append(ep)
              except exceptions.ClientRequestException as e:
                  print(f"❌ API error: {e.status_code} {e.error_code} — {e.error_msg}\n")
              except Exception as e:
                  print(f"❌ Connection/other error: {type(e).__name__}: {e}\n")

          print("=" * 60)
          if working:
              print(f"✅ WORKING ENDPOINT(S) FOUND:")
              for w in working:
                  print(f"   {w}")
              print("\nSet this as your HW_VPC_ENDPOINT repo variable.")
          else:
              print("❌ None of the candidate endpoints worked.")
              print("   Ask your Alpha Edge infra team for the exact VPC service hostname.")
          PYEOF
