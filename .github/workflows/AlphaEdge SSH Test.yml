name: 🔍 AlphaEdge SSH Password Test
on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: '🛠️ Install sshpass'
        run: sudo apt-get install -y sshpass

      - name: '🔍 Test SSH Password Connection'
        env:
          VM_PASS: ${{ secrets.VM_SSH_PASSWORD }}
        run: |
          sshpass -p "$VM_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            root@202.165.25.8 \
            'uname -a && echo connected as $(whoami)'

          echo ""
          echo "========================================"
          echo "2. RUN BENCHMARK (scan only)"
          echo "========================================"
          chmod +x multi_os_benchmark.sh
          AUDIT_PASS=dummy \
          SSHPASS="$VM_PASS" \
          ./multi_os_benchmark.sh \
            --headless \
            --cloud     huaweicloud \
            --mode      scan \
            --profile   cis \
            --target-os ubuntu \
            --target-ip "$VM_IP" \
            --targets   all
