name: 🔍 Debug HuaweiCloud Auth

on:
  workflow_dispatch:

jobs:
  debug-hcloud:
    runs-on: ubuntu-latest

    steps:
      - name: '🔍 Debug hcloud Auth'
        env:
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          HW_REGION:              ${{ vars.HW_REGION }}
          HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
        run: |
          echo "========================================"
          echo "1. CHECKING VARIABLES"
          echo "========================================"
          echo "HW_REGION     : $HW_REGION"
          echo "HW_PROJECT_ID : $HW_PROJECT_ID"
          echo "AK length     : ${#HUAWEICLOUD_ACCESS_KEY}"
          echo "SK length     : ${#HUAWEICLOUD_SECRET_KEY}"
          [ -z "$HUAWEICLOUD_ACCESS_KEY" ] && echo "❌ HW_ACCESS_KEY is EMPTY" || echo "✅ HW_ACCESS_KEY is set"
          [ -z "$HUAWEICLOUD_SECRET_KEY" ] && echo "❌ HW_SECRET_KEY is EMPTY" || echo "✅ HW_SECRET_KEY is set"
          [ -z "$HW_REGION" ]              && echo "❌ HW_REGION is EMPTY"     || echo "✅ HW_REGION is set"
          [ -z "$HW_PROJECT_ID" ]          && echo "❌ HW_PROJECT_ID is EMPTY" || echo "✅ HW_PROJECT_ID is set"

          echo ""
          echo "========================================"
          echo "2. DOWNLOADING KooCLI"
          echo "========================================"
          curl -sSL \
            "https://ap-southeast-3-hwcloudcli.obs.ap-southeast-3.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" \
            -o /tmp/hcloud.tar.gz \
            && echo "✅ hcloud tar.gz downloaded OK" \
            || { echo "❌ Download FAILED"; exit 1; }

          tar -zxf /tmp/hcloud.tar.gz -C /tmp/
          mv /tmp/hcloud /usr/local/bin/hcloud
          chmod +x /usr/local/bin/hcloud
          echo "✅ hcloud installed"
          hcloud --version 2>&1 || true

          echo ""
          echo "========================================"
          echo "3. ACCEPTING EULA + CONFIGURING"
          echo "========================================"
          # Accept EULA non-interactively
          hcloud configure init \
            --cli-access-key="$HUAWEICLOUD_ACCESS_KEY" \
            --cli-secret-key="$HUAWEICLOUD_SECRET_KEY" \
            --cli-region="$HW_REGION" \
            --agree-privacy-statement 2>&1 || true
          echo "Init exit code: $?"

          echo ""
          echo "--- trying configure set after init ---"
          hcloud configure set \
            --cli-access-key="$HUAWEICLOUD_ACCESS_KEY" \
            --cli-secret-key="$HUAWEICLOUD_SECRET_KEY" \
            --cli-region="$HW_REGION" 2>&1 || true
          echo "Configure set exit code: $?"

          echo ""
          echo "hcloud configure list:"
          hcloud configure list 2>&1 || true

          echo ""
          echo "========================================"
          echo "4. TESTING ECS API CALL"
          echo "========================================"
          hcloud ECS ListServersDetails \
            --cli-region="$HW_REGION" \
            --cli-output json 2>&1
          echo "ECS call exit code: $?"

          echo ""
          echo "========================================"
          echo "5. TESTING ECS WITH EXPLICIT ENDPOINT"
          echo "========================================"
          hcloud ECS ListServersDetails \
            --cli-region="$HW_REGION" \
            --cli-output json \
            --cli-endpoint="https://ecs.$HW_REGION.myhuaweicloud.com" 2>&1
          echo "ECS with endpoint exit code: $?"

          echo ""
          echo "========================================"
          echo "6. CHECK AVAILABLE hcloud configure FLAGS"
          echo "========================================"
          hcloud configure set --help 2>&1 || true
