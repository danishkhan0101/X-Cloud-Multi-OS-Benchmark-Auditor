- name: '🔐 Get IAM Token & Test ECS'
        env:
          HW_ACCESS_KEY:    ${{ secrets.HW_ACCESS_KEY }}
          HW_SECRET_KEY:    ${{ secrets.HW_SECRET_KEY }}
          HW_REGION:        ${{ vars.HW_REGION }}
          HW_PROJECT_ID:    ${{ vars.HW_PROJECT_ID }}
          HW_IAM_ENDPOINT:  ${{ vars.HW_IAM_ENDPOINT }}
          HW_ECS_ENDPOINT:  ${{ vars.HW_ECS_ENDPOINT }}
          HW_ECS_ID:        ${{ vars.HW_ECS_ID }}
        run: |
          echo "========================================"
          echo "2. GETTING IAM TOKEN (AlphaEdge)"
          echo "========================================"
          echo ">> Hitting: ${HW_IAM_ENDPOINT}/v3/auth/tokens"

          HTTP_STATUS=$(curl -s \
            -D /tmp/iam_headers.txt \
            -o /tmp/iam_body.json \
            -w "%{http_code}" \
            -X POST \
            "${HW_IAM_ENDPOINT}/v3/auth/tokens" \
            -H "Content-Type: application/json" \
            -d "{
              \"auth\": {
                \"identity\": {
                  \"methods\": [\"hw_ak_sk\"],
                  \"hw_ak_sk\": {
                    \"access\": { \"key\": \"$HW_ACCESS_KEY\" },
                    \"secret\": { \"key\": \"$HW_SECRET_KEY\" }
                  }
                },
                \"scope\": {
                  \"project\": { \"id\": \"$HW_PROJECT_ID\" }
                }
              }
            }")

          echo "IAM HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ IAM token obtained!"
            TOKEN=$(grep -i '^x-subject-token:' /tmp/iam_headers.txt | tr -d '\r' | awk '{print $2}')
            echo "Token length: ${#TOKEN}"
          else
            echo "❌ IAM token FAILED — full response:"
            jq . /tmp/iam_body.json 2>/dev/null || cat /tmp/iam_body.json
            cat /tmp/iam_headers.txt
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "3. QUERYING SPECIFIC ECS"
          echo "========================================"
          echo ">> Hitting: ${HW_ECS_ENDPOINT}/v1/${HW_PROJECT_ID}/cloudservers/${HW_ECS_ID}"

          ECS_STATUS=$(curl -s \
            -o /tmp/ecs_resp.json \
            -w "%{http_code}" \
            -X GET \
            "${HW_ECS_ENDPOINT}/v1/${HW_PROJECT_ID}/cloudservers/${HW_ECS_ID}" \
            -H "X-Auth-Token: $TOKEN" \
            -H "Content-Type: application/json")

          echo "ECS HTTP Status: $ECS_STATUS"

          if [ "$ECS_STATUS" = "200" ]; then
            echo "✅ ECS found! Details:"
            jq -r '
              .server |
              "  Name   : \(.name)",
              "  Status : \(.status)",
              "  Flavor : \(.flavor.id)",
              "  AZ     : \(.["OS-EXT-AZ:availability_zone"])",
              "  Created: \(.created)"
            ' /tmp/ecs_resp.json
            echo "  IPs:"
            jq -r '
              .server.addresses
              | to_entries[]
              | .key as $net
              | .value[]
              | "  IP [\($net)]: \(.addr) (\(.["OS-EXT-IPS:type"]))"
            ' /tmp/ecs_resp.json
          else
            echo "❌ ECS query FAILED:"
            jq . /tmp/ecs_resp.json 2>/dev/null || cat /tmp/ecs_resp.json
          fi

          echo ""
          echo "========================================"
          echo "4. LIST ALL ECS IN PROJECT"
          echo "========================================"
          echo ">> Hitting: ${HW_ECS_ENDPOINT}/v1/${HW_PROJECT_ID}/cloudservers/detail"

          LIST_STATUS=$(curl -s \
            -o /tmp/ecs_list.json \
            -w "%{http_code}" \
            -X GET \
            "${HW_ECS_ENDPOINT}/v1/${HW_PROJECT_ID}/cloudservers/detail" \
            -H "X-Auth-Token: $TOKEN" \
            -H "Content-Type: application/json")

          echo "ECS List HTTP Status: $LIST_STATUS"

          if [ "$LIST_STATUS" = "200" ]; then
            COUNT=$(jq '.servers | length' /tmp/ecs_list.json)
            echo "✅ Total servers found: $COUNT"
            jq -r '.servers[] | "  [\(.status)] \(.name) — \(.id)"' /tmp/ecs_list.json
          else
            echo "❌ ECS list FAILED:"
            jq . /tmp/ecs_list.json 2>/dev/null || cat /tmp/ecs_list.json
          fi
