name: 🔍 Debug HuaweiCloud Auth

on:
  workflow_dispatch:

jobs:
  debug-hcloud:
    runs-on: ubuntu-latest

    steps:
      - name: '🔍 Debug hcloud Auth'
        env:
          HUAWEICLOUD_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HUAWEICLOUD_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
          HW_REGION:              ${{ vars.HW_REGION }}
          HW_PROJECT_ID:          ${{ vars.HW_PROJECT_ID }}
        run: |
          echo "========================================"
          echo "1. CHECKING VARIABLES"
          echo "========================================"
          echo "HW_REGION     : $HW_REGION"
          echo "HW_PROJECT_ID : $HW_PROJECT_ID"
          echo "AK length     : ${#HUAWEICLOUD_ACCESS_KEY}"
          echo "SK length     : ${#HUAWEICLOUD_SECRET_KEY}"
          [ -z "$HUAWEICLOUD_ACCESS_KEY" ] && echo "❌ HW_ACCESS_KEY is EMPTY" || echo "✅ HW_ACCESS_KEY is set"
          [ -z "$HUAWEICLOUD_SECRET_KEY" ] && echo "❌ HW_SECRET_KEY is EMPTY" || echo "✅ HW_SECRET_KEY is set"
          [ -z "$HW_REGION" ]              && echo "❌ HW_REGION is EMPTY"     || echo "✅ HW_REGION is set"
          [ -z "$HW_PROJECT_ID" ]          && echo "❌ HW_PROJECT_ID is EMPTY" || echo "✅ HW_PROJECT_ID is set"

          echo ""
          echo "========================================"
          echo "2. DOWNLOADING KooCLI"
          echo "========================================"
          # Try official international URL
          curl -sSL \
            "https://cli-intl.obs.ap-southeast-1.myhuaweicloud.com/hcloud_linux_amd64" \
            -o /usr/local/bin/hcloud && chmod +x /usr/local/bin/hcloud \
            && echo "✅ hcloud downloaded OK" \
            || { echo "❌ hcloud download FAILED — trying fallback...";
                 curl -sSL \
                   "https://cli.obs.myhuaweicloud.com/hcloud/latest/hcloud_linux_amd64" \
                   -o /usr/local/bin/hcloud && chmod +x /usr/local/bin/hcloud \
                   && echo "✅ hcloud downloaded OK (fallback)" \
                   || { echo "❌ Both download URLs failed"; exit 1; }; }

          # Verify it's actually a binary not an XML error
          if file /usr/local/bin/hcloud | grep -q "XML\|ASCII\|HTML"; then
            echo "❌ Downloaded file is not a binary — wrong URL returned XML/HTML"
            cat /usr/local/bin/hcloud
            exit 1
          fi
          hcloud --version 2>&1 || true

          echo ""
          echo "========================================"
          echo "3. CONFIGURING hcloud"
          echo "========================================"
          hcloud configure set \
            --cli-access-key="$HUAWEICLOUD_ACCESS_KEY" \
            --cli-secret-key="$HUAWEICLOUD_SECRET_KEY" \
            --cli-region="$HW_REGION" \
            --cli-project-id="$HW_PROJECT_ID"
          echo "Configure exit code: $?"
          hcloud configure list 2>&1 || true

          echo ""
          echo "========================================"
          echo "4. TESTING ECS API CALL (verbose)"
          echo "========================================"
          hcloud ECS ListServersDetails \
            --cli-region="$HW_REGION" \
            --cli-output json 2>&1
          echo "ECS call exit code: $?"

          echo ""
          echo "========================================"
          echo "5. TESTING WITH PROJECT ID EXPLICITLY"
          echo "========================================"
          hcloud ECS ListServersDetails \
            --cli-region="$HW_REGION" \
            --project-id="$HW_PROJECT_ID" \
            --cli-output json 2>&1
          echo "ECS call with project_id exit code: $?"
