name: 🔍 Verify oscap Cleanup

on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: 'SSH user to connect as'
        required: true
        default: 'ubuntu'
      target_ip:
        description: 'IP address of the ECS server to check'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v4

      - name: '🔑 Setup SSH Key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UBUNTU_SSH_KEY }}

      - name: '🔍 Run Verification'
        run: |
          chmod +x verify_cleanup.sh
          ./verify_cleanup.sh "${{ github.event.inputs.ssh_user }}" "${{ github.event.inputs.target_ip }}"
