---
- name: TM LSB Full Remediation (20 Rules)
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # THE 5 NEW RULES (Trace Files, MAC, Firewall)
    # ==========================================
    
    - name: LSB14 - Ensure all system packages are up to date (Ubuntu equivalent of yum update)
      apt:
        upgrade: dist
        update_cache: yes

    - name: LSB14 - Write Patch Trace Evidence for OpenSCAP
      copy: 
        dest: /var/log/tm_patch_status.log
        content: "PATCH_STATUS=COMPLIANT\n"

    - name: LSB25 & 26 - Ensure AppArmor is installed and active
      apt: 
        name: apparmor
        state: present

    - name: LSB27 - Install UFW (Required for Minimal Cloud Images)
      apt:
        name: ufw
        state: present

    - name: Safety Check - Ensure SSH is allowed before locking down Firewall
      ufw:
        rule: allow
        name: OpenSSH

    - name: LSB27 & 29 - Enable UFW and set Default DROP
      ufw: 
        state: enabled
        default: deny
        direction: incoming

    # ==========================================
    # THE ORIGINAL 15 RULES (System & Packages)
    # ==========================================

    - name: LSB15 - Enforce Timezone (Modern Systemd)
      timezone: 
        name: Asia/Kuala_Lumpur

    - name: LSB15 - Enforce Timezone (OVAL Scanner Compliance)
      copy:
        dest: /etc/timezone
        content: "Asia/Kuala_Lumpur\n"
        mode: '0644'

    - name: LSB19 & LSB28 - Harden SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.r }}"
        line: "{{ item.l }}"
      loop:
        - { r: '^#?Banner', l: 'Banner /etc/sshbanner.txt' }
        - { r: '^#?PermitRootLogin', l: 'PermitRootLogin no' }
      notify: Restart SSH

    - name: LSB19 - Create Banner Text
      copy:
        dest: /etc/sshbanner.txt
        content: "TM AUTHORIZED ACCESS ONLY. ALL ACTIVITIES ARE MONITORED.\n"

    - name: LSB20 - Disable Uncommon Filesystems
      copy:
        dest: /etc/modprobe.d/tm_hardened.conf
        content: |
          install cramfs /bin/true
          install freevxfs /bin/true
          install jffs2 /bin/true
          install hfs /bin/true
          install hfsplus /bin/true
          install squashfs /bin/true
          install udf /bin/true

    - name: LSB39 - Install Auditing Library (auditd)
      apt:
        name: auditd
        state: present

    - name: LSB41 - Configure Rsyslog Forwarding to NGSIEM
      lineinfile:
        path: /etc/rsyslog.conf
        line: "*.* @@10.0.0.50:514"
        state: present
      notify: Restart Rsyslog

    - name: LSB30 to LSB38 - Purge All Forbidden Packages
      apt: 
        name: 
          - squid
          - dovecot-core
          - vsftpd
          - bind9
          - isc-dhcp-server
          - telnet
          - rsh-client
          - ldap-utils
          - snmp
        state: absent
        purge: yes

  handlers:
    - name: Restart SSH
      service: 
        name: ssh 
        state: restarted
        
    - name: Restart Rsyslog
      service:
        name: rsyslog
        state: restarted
