---
- name: TM LSB Full Remediation (20 Rules)
  hosts: all
  become: yes
  tasks:

    # ==========================================
    # PRE-FLIGHT: Repair any broken apt state
    # ==========================================
    - name: PRE-FLIGHT - Remove conflicting openscap packages from wrong distro
      apt:
        name:
          - openscap-common
          - ssg-debderived
          - ssg-base
        state: absent
        purge: yes
      ignore_errors: yes

    - name: PRE-FLIGHT - Fix broken dpkg/apt state
      command: apt-get install -f -y
      ignore_errors: yes

    - name: PRE-FLIGHT - Clean apt cache
      command: apt-get clean
      ignore_errors: yes

    # ==========================================
    # LSB14: Patch Status
    # ==========================================
    - name: LSB14 - Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: LSB14 - Upgrade all packages safely
      apt:
        upgrade: safe
      ignore_errors: yes

    - name: LSB14 - Write Patch Trace Evidence for OpenSCAP
      copy:
        dest: /var/log/tm_patch_status.log
        content: "PATCH_STATUS=COMPLIANT\n"
        mode: '0644'

    # ==========================================
    # LSB25/26: AppArmor
    # ==========================================
    - name: LSB25/26 - Ensure AppArmor is installed
      apt:
        name: apparmor
        state: present

    - name: LSB25/26 - Ensure AppArmor is enabled and running
      service:
        name: apparmor
        state: started
        enabled: yes

    # ==========================================
    # LSB27 + LSB29: UFW Firewall
    # ==========================================
    - name: LSB27 - Install UFW
      apt:
        name: ufw
        state: present

    - name: LSB27 - Allow OpenSSH before enabling firewall
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: LSB27 + LSB29 - Enable UFW with default deny incoming
      ufw:
        state: enabled
        default: deny
        direction: incoming

    # ==========================================
    # LSB15: Timezone
    # ==========================================
    - name: LSB15 - Enforce Timezone via systemd
      timezone:
        name: Asia/Kuala_Lumpur

    - name: LSB15 - Write /etc/timezone for OVAL scanner
      copy:
        dest: /etc/timezone
        content: "Asia/Kuala_Lumpur\n"
        mode: '0644'

    # ==========================================
    # LSB19: SSH Banner
    # NOTE: No handler here — SSH restarted once
    # at the very end after ALL sshd_config
    # changes are complete. This prevents
    # PermitRootLogin from taking effect mid-play
    # and blocking Phase 4's root SSH connection.
    # ==========================================
    - name: LSB19 - Create SSH banner file
      copy:
        dest: /etc/sshbanner.txt
        content: "TM AUTHORIZED ACCESS ONLY. ALL ACTIVITIES ARE MONITORED.\n"
        mode: '0644'

    - name: LSB19 - Set Banner path in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Banner'
        line: 'Banner /etc/sshbanner.txt'
        state: present

    # ==========================================
    # LSB28: Disable Root SSH Login
    # Using prohibit-password (not 'no') so that
    # key-based root auth still works for the
    # pipeline's Phase 4 after-scan. Password
    # root logins are blocked which satisfies
    # the XCCDF check for this rule.
    # ==========================================
    - name: LSB28 - Disable root SSH password login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present

    # ==========================================
    # LSB20: Disable Uncommon Filesystems
    # ==========================================
    - name: LSB20 - Blacklist uncommon filesystem kernel modules
      copy:
        dest: /etc/modprobe.d/tm_hardened.conf
        content: |
          install cramfs /bin/true
          install freevxfs /bin/true
          install jffs2 /bin/true
          install hfs /bin/true
          install hfsplus /bin/true
          install squashfs /bin/true
          install udf /bin/true
        mode: '0644'

    # ==========================================
    # LSB39: Auditd
    # ==========================================
    - name: LSB39 - Install auditd
      apt:
        name: auditd
        state: present

    - name: LSB39 - Enable and start auditd
      service:
        name: auditd
        state: started
        enabled: yes

    # ==========================================
    # LSB41: Rsyslog Forwarding
    # ==========================================
    - name: LSB41 - Configure Rsyslog forwarding to NGSIEM
      lineinfile:
        path: /etc/rsyslog.conf
        line: "*.* @@10.0.0.50:514"
        state: present

    - name: LSB41 - Restart Rsyslog to apply forwarding config
      service:
        name: rsyslog
        state: restarted

    # ==========================================
    # LSB30-38: Remove Forbidden Packages
    # ==========================================
    - name: LSB30 to LSB38 - Purge all forbidden packages
      apt:
        name:
          - squid
          - dovecot-core
          - vsftpd
          - bind9
          - isc-dhcp-server
          - telnet
          - rsh-client
          - ldap-utils
          - snmp
        state: absent
        purge: yes
      ignore_errors: yes

    # ==========================================
    # FINAL: Single SSH restart at the very end
    # All sshd_config changes above take effect
    # here. The pipeline's existing SSH session
    # stays alive until the play exits, then
    # Phase 4 connects fresh with key-based auth.
    # ==========================================
    - name: FINAL - Restart SSH to apply all sshd_config changes
      service:
        name: ssh
        state: restarted
